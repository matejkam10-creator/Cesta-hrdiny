<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Společný chat | Cesta hrdiny</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d0c11; color: #f4e4c4; font: 18px Georgia, serif; }
    main { width: min(100% - 32px, 760px); margin: 24px auto 48px; }
    h1 { color: #efd49b; }
    a { color: #efd49b; }
    .box { padding: 18px; border: 1px solid #6a573f; border-radius: 16px; background: #1b1720; }
    #messages { min-height: 260px; max-height: 55vh; overflow-y: auto; margin-bottom: 16px; }
    .message { padding: 10px 0; border-bottom: 1px solid #514434; overflow-wrap: anywhere; }
    .message:last-child { border-bottom: 0; }
    .message time { color: #c5b69c; font-size: .8em; }
    .message p { white-space: pre-wrap; margin: 6px 0 0; }
    textarea { width: 100%; min-height: 90px; padding: 12px; border: 1px solid #a88a61; border-radius: 8px; background: #151219; color: #fff; font: inherit; resize: vertical; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: #a98248; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .muted { color: #c5b69c; }
  </style>
</head>
<body>
  <main>
    <p><a href="mapy.html">← Zpět na mapy</a> · <a href="druziny.html">Moje družiny</a></p>
    <h1>Společný chat</h1>
    <p class="muted">Zprávy vidí všichni přihlášení hráči. Soukromý chat družiny najdeš na její stránce.</p>
    <section class="box" aria-label="Zprávy společného chatu">
      <div id="messages" aria-live="polite">Načítám zprávy…</div>
      <button id="refresh" type="button">Obnovit zprávy</button>
    </section>
    <form id="send" class="box" style="margin-top:16px">
      <label for="body">Nová zpráva (nejvýše 1000 znaků)</label>
      <textarea id="body" maxlength="1000" required></textarea>
      <p><button type="submit">Odeslat zprávu</button></p>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    const client = supabase.createClient("https://qgnallfqanixepfvrzjn.supabase.co", "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi");
    const messages = document.getElementById("messages");
    const status = document.getElementById("status");
    const form = document.getElementById("send");
    const { data: { user }, error: authError } = await client.auth.getUser();
    if (authError || !user) location.replace("index.html");
    else {
      const { data: character, error: characterError } = await client.from("characters")
        .select("id").eq("user_id", user.id).single();
      if (characterError || !character) {
        messages.textContent = "Nejdřív si vytvoř postavu.";
        form.hidden = true;
      } else {
        let refreshing = false;
        async function refresh() {
          if (refreshing) return;
          refreshing = true;
          try {
            const { data, error } = await client.rpc("read_global_chat");
            if (error) {
              messages.textContent = "Zprávy se nepodařilo načíst: " + error.message;
              return;
            }
            const nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 90;
            const oldIds = [...messages.querySelectorAll("[data-id]")].map(e => e.dataset.id).join(",");
            const newIds = data.map(item => item.id).join(",");
            if (oldIds === newIds && messages.querySelector("[data-id]")) return;
            messages.replaceChildren();
            if (!data.length) messages.textContent = "Zatím tu nejsou žádné zprávy.";
            for (const item of data) {
              const row = document.createElement("article");
              row.className = "message";
              row.dataset.id = item.id;
              const name = document.createElement("strong");
              name.textContent = item.author;
              const time = document.createElement("time");
              time.dateTime = item.created_at;
              time.textContent = " · " + new Date(item.created_at).toLocaleString("cs-CZ");
              const body = document.createElement("p");
              body.textContent = item.message;
              row.append(name, time, body);
              messages.append(row);
            }
            if (nearBottom || !oldIds) messages.scrollTop = messages.scrollHeight;
          } finally {
            refreshing = false;
          }
        }
        document.getElementById("refresh").addEventListener("click", () => refresh().catch(e => status.textContent = e.message));
        form.addEventListener("submit", async event => {
          event.preventDefault();
          const field = document.getElementById("body");
          const body = field.value.trim();
          if (!body || body.length > 1000) return;
          const button = form.querySelector("button");
          button.disabled = true;
          try {
            const { error } = await client.from("messages").insert({ group_id: null, character_id: character.id, message: body });
            if (error) throw error;
            field.value = "";
            status.textContent = "Zpráva odeslána.";
            await refresh();
          } catch (error) {
            status.textContent = "Zprávu se nepodařilo odeslat: " + error.message;
          } finally {
            button.disabled = false;
          }
        });
        await refresh().catch(e => messages.textContent = "Zprávy se nepodařilo načíst: " + e.message);
        setInterval(() => { if (!document.hidden) refresh().catch(() => {}); }, 12000);
      }
    }
  </script>
</body>
</html>
