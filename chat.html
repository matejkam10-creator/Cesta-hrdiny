<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Společný chat | Cesta hrdiny</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d0c11; color: #f4e4c4; font: 18px Georgia, serif; }
    main { width: min(100% - 32px, 760px); margin: 24px auto 48px; }
    h1 { color: #efd49b; }
    a { color: #efd49b; }
    .box { padding: 18px; border: 1px solid #6a573f; border-radius: 16px; background: #1b1720; }
    #messages { min-height: 260px; max-height: 55vh; overflow-y: auto; margin-bottom: 16px; }
    .message { padding: 10px 0; border-bottom: 1px solid #514434; overflow-wrap: anywhere; }
    .message:last-child { border-bottom: 0; }
    .message time { color: #c5b69c; font-size: .8em; }
    .message p { white-space: pre-wrap; margin: 6px 0 0; }
    .message-author { display: flex; align-items: center; gap: 10px; }
    .message-avatar { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid #b69360; border-radius: 50%; background: #332a39; object-fit: cover; color: #f1d398; font-size: 19px; }
    .message-byline { min-width: 0; }
    textarea { width: 100%; min-height: 90px; padding: 12px; border: 1px solid #a88a61; border-radius: 8px; background: #151219; color: #fff; font: inherit; resize: vertical; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: #a98248; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .muted { color: #c5b69c; }

    /* Stejná hlavička a nabídka jako na mapách. */
    [hidden] { display: none !important; }
    .site-header { font-size: 16px; position: relative; z-index: 3; padding: 18px; border-bottom: 1px solid #5d4d38; background: #17131b; }
    .site-header .header-inner { max-width: 1200px; margin: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .site-header h1 { margin: 0; color: #efd49b; font-size: clamp(24px, 5vw, 36px); }
    .site-header h1 a { color: inherit; text-decoration: none; }
    .site-header h1 a:hover, .site-header h1 a:focus-visible { text-decoration: underline; }
    .site-header #menuToggle { display: grid; place-items: center; width: 48px; height: 48px; margin: 0; padding: 0; border: 1px solid #b69360; border-radius: 10px; background: #302634; color: #f1d398; font: inherit; font-size: 29px; line-height: 1; cursor: pointer; }
    .site-header #mainMenu { display: block; position: absolute; top: 100%; right: 18px; width: min(340px, calc(100vw - 36px)); margin: 0; padding: 8px; border: 1px solid #89704d; border-radius: 0 0 14px 14px; background: #211b25; box-shadow: 0 12px 28px #000a; }
    .site-header #mainMenu a { display: block; padding: 12px 14px; border-bottom: 1px solid #564535; text-decoration: none; }
    .site-header #mainMenu a:last-child { border-bottom: 0; }
    .site-header #mainMenu a:hover, .site-header #mainMenu a:focus-visible { background: #3a2c36; text-decoration: underline; }
  </style>
</head>
<body>
<header class="site-header"><div class="header-inner">
    <h1><a href="mapy.html">⚔️ Cesta hrdiny</a></h1>
    <button id="menuToggle" type="button" aria-label="Otevřít nabídku" aria-controls="mainMenu" aria-expanded="false">☰</button>
    <nav id="mainMenu" aria-label="Hlavní nabídka" hidden><a href="mapy.html">Mapy</a><a href="postava.html">Moje postava</a><a href="urovne.html">Úrovně</a><a href="historie.html">Moje úkoly</a><a href="chat.html">Společný chat</a><a href="druziny.html">Družiny</a><a id="adminLink" href="admin-ukoly.html" hidden>Kontrola úkolů</a></nav>
  </div></header>

  <main>
    <h1>Společný chat</h1>
    <p class="muted">Zprávy vidí všichni přihlášení hráči. Soukromý chat družiny najdeš na její stránce.</p>
    <section class="box" aria-label="Zprávy společného chatu">
      <div id="messages" aria-live="polite">Načítám zprávy…</div>
      <button id="refresh" type="button">Obnovit zprávy</button>
    </section>
    <form id="send" class="box" style="margin-top:16px">
      <label for="body">Nová zpráva (nejvýše 1000 znaků)</label>
      <textarea id="body" maxlength="1000" required></textarea>
      <p><button type="submit">Odeslat zprávu</button></p>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const menuButton = document.getElementById("menuToggle");
    const menu = document.getElementById("mainMenu");
    function closeMenu() {
      menu.hidden = true;
      menuButton.setAttribute("aria-expanded", "false");
      menuButton.setAttribute("aria-label", "Otevřít nabídku");
    }
    menuButton.addEventListener("click", () => {
      const opening = menu.hidden;
      menu.hidden = !opening;
      menuButton.setAttribute("aria-expanded", String(opening));
      menuButton.setAttribute("aria-label", opening ? "Zavřít nabídku" : "Otevřít nabídku");
    });
    document.addEventListener("keydown", event => { if (event.key === "Escape") closeMenu(); });
    document.addEventListener("pointerdown", event => {
      if (!menu.hidden && !menu.contains(event.target) && !menuButton.contains(event.target)) closeMenu();
    });
    supabase.createClient("https://qgnallfqanixepfvrzjn.supabase.co", "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi")
      .rpc("is_admin").then(({ data }) => { if (data) document.getElementById("adminLink").hidden = false; });
  </script>

  <script type="module">
    const client = supabase.createClient("https://qgnallfqanixepfvrzjn.supabase.co", "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi");
    const messages = document.getElementById("messages");
    const status = document.getElementById("status");
    const form = document.getElementById("send");
    const { data: { user }, error: authError } = await client.auth.getUser();
    if (authError || !user) location.replace("index.html");
    else {
      const { data: character, error: characterError } = await client.from("characters")
        .select("id").eq("user_id", user.id).single();
      if (characterError || !character) {
        messages.textContent = "Nejdřív si vytvoř postavu.";
        form.hidden = true;
      } else {
        let refreshing = false;
        let lastSignature = "";
        const avatarBase = "https://qgnallfqanixepfvrzjn.supabase.co/storage/v1/object/public/avatars/";
        function avatarFor(url) {
          const fallback = () => {
            const icon = document.createElement("span");
            icon.className = "message-avatar";
            icon.textContent = "👤";
            icon.setAttribute("aria-hidden", "true");
            return icon;
          };
          if (!url?.startsWith(avatarBase)) return fallback();
          const image = document.createElement("img");
          image.className = "message-avatar";
          image.src = url;
          image.alt = "";
          image.loading = "lazy";
          image.addEventListener("error", () => image.replaceWith(fallback()), { once: true });
          return image;
        }
        async function refresh() {
          if (refreshing) return;
          refreshing = true;
          try {
            const { data, error } = await client.rpc("read_global_chat");
            if (error) {
              messages.textContent = "Zprávy se nepodařilo načíst: " + error.message;
              return;
            }
            const nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 90;
            const signature = data.map(item => `${item.id}:${item.avatar_url || ""}`).join("|");
            if (lastSignature === signature && messages.querySelector("[data-id]")) return;
            messages.replaceChildren();
            if (!data.length) messages.textContent = "Zatím tu nejsou žádné zprávy.";
            for (const item of data) {
              const row = document.createElement("article");
              row.className = "message";
              row.dataset.id = item.id;
              const name = document.createElement("strong");
              name.textContent = item.author;
              const time = document.createElement("time");
              time.dateTime = item.created_at;
              time.textContent = " · " + new Date(item.created_at).toLocaleString("cs-CZ");
              const byline = document.createElement("div");
              byline.className = "message-byline";
              byline.append(name, time);
              const author = document.createElement("div");
              author.className = "message-author";
              author.append(avatarFor(item.avatar_url), byline);
              const body = document.createElement("p");
              body.textContent = item.message;
              row.append(author, body);
              messages.append(row);
            }
            if (nearBottom || !lastSignature) messages.scrollTop = messages.scrollHeight;
            lastSignature = signature;
          } finally {
            refreshing = false;
          }
        }
        document.getElementById("refresh").addEventListener("click", () => refresh().catch(e => status.textContent = e.message));
        form.addEventListener("submit", async event => {
          event.preventDefault();
          const field = document.getElementById("body");
          const body = field.value.trim();
          if (!body || body.length > 1000) return;
          const button = form.querySelector("button");
          button.disabled = true;
          try {
            const { error } = await client.from("messages").insert({ group_id: null, character_id: character.id, message: body });
            if (error) throw error;
            field.value = "";
            status.textContent = "Zpráva odeslána.";
            await refresh();
          } catch (error) {
            status.textContent = "Zprávu se nepodařilo odeslat: " + error.message;
          } finally {
            button.disabled = false;
          }
        });
        await refresh().catch(e => messages.textContent = "Zprávy se nepodařilo načíst: " + e.message);
        setInterval(() => { if (!document.hidden) refresh().catch(() => {}); }, 12000);
      }
    }
  </script>
  <script src="navigace.js" defer></script>
</body>
</html>
