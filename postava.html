<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moje postava | Cesta hrdiny</title>
</head>

<body style="background:#0b0910;color:#e8c77a;text-align:center;padding:50px;font-family:Georgia,serif;">

  <h1>⚔️ Cesta hrdiny</h1>

  <h2>Moje postava</h2>

  <p>Přihlášení funguje.</p>

  <div id="postava">Načítám tvoji postavu...</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    const SUPABASE_URL = "https://qgnallfqanixepfvrzjn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data: { user } } = await client.auth.getUser();
    const { data: postava, error } = await client
  .from("characters")
  .select("*")
  .eq("user_id", user.id)
  .single();
    if (error) {
  document.getElementById("postava").textContent = "Postavu se nepodařilo načíst.";
} else {
      document.getElementById("postava").innerHTML =
  "<h2>" + postava.name + "</h2>" +
  "<p>Úroveň: " + postava.level + "</p>" +
  "<p>XP: " + postava.total_xp + "</p>";
    }
    </script>

</body>
</html>
