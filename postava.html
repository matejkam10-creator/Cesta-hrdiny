<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moje postava | Cesta hrdiny</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0d0c11; color: #f4e4c4; font: 18px Georgia, serif; }
    main { width: min(100% - 32px, 760px); margin: 24px auto 48px; }
    h1, h2, h3 { color: #efd49b; }
    h1 { font-size: clamp(28px, 6vw, 38px); }
    .karta { padding: 20px; margin: 18px 0; border: 1px solid #6a573f; border-radius: 16px; background: #1b1720; }
    .avatar { display: block; width: 110px; height: 110px; margin: auto; border: 2px solid #e4c48a; border-radius: 50%; object-fit: cover; }
    #postava { text-align: center; }
    #postava h2 { margin-bottom: 8px; }
    label { display: block; margin-top: 14px; }
    progress { display: block; width: 100%; height: 20px; accent-color: #b38b4b; }
    input, textarea { display: block; width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #a88a61; border-radius: 8px; background: #151219; color: #fff; font: inherit; }
    input[type="file"] { overflow: hidden; }
    input[type="file"]::file-selector-button { padding: 8px 12px; margin-right: 10px; border: 0; border-radius: 6px; background: #a98248; color: #fff; font: inherit; }
    textarea { min-height: 130px; resize: vertical; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: #a98248; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    a { color: #efd49b; }
    nav { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 18px 0; }
    #logout { background: #794646; }
    #stavProfilu, #stavAvatara { min-height: 24px; }
    #popis { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>

<body>
<main>
  <nav><a href="mapy.html">← Zpět na mapy</a><a href="urovne.html">Úrovně a XP</a><a href="druziny.html">Moje družiny</a></nav>
  <h1>⚔️ Cesta hrdiny</h1>
  <h2>Moje postava</h2>
  <section id="postava" class="karta">Načítám tvoji postavu...</section>
  <form id="upravitProfil" class="karta" style="display:none;margin-top:16px;">
    <h3>Upravit profil</h3>
    <label for="prezdivka">Přezdívka (2–30 znaků)</label>
    <input id="prezdivka" maxlength="30" placeholder="Jak ti mají říkat?">
    <label for="popisProfilu">Popis postavy (nejvýše 500 znaků)</label>
    <textarea id="popisProfilu" maxlength="500" placeholder="Napiš něco o své postavě"></textarea>
    <button type="submit">Uložit profil</button>
    <p id="stavProfilu" role="status"></p>
  </form>
  <form id="nahratAvatar" class="karta" style="display:none;margin-top:16px;">
    <h3>Fotka avatara</h3>
    <label for="souborAvatara">Vyber obrázek JPG, PNG nebo WebP (nejvýše 5 MB)</label>
    <input id="souborAvatara" type="file" accept="image/jpeg,image/png,image/webp" required>
    <button type="submit">Nahrát avatar</button>
    <p id="stavAvatara" role="status"></p>
  </form>
  <button id="logout">Odhlásit se</button>
</main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    const SUPABASE_URL = "https://qgnallfqanixepfvrzjn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data: { user } } = await client.auth.getUser();
    if (!user) {
      window.location.replace("index.html");
    } else {
    const { data: postava, error } = await client
  .from("characters")
  .select("*")
  .eq("user_id", user.id)
  .single();
    if (error) {
  document.getElementById("postava").textContent = "Postavu se nepodařilo načíst.";
} else {
      const karta = document.getElementById("postava");
      karta.replaceChildren();
      const jmeno = document.createElement("h2");
      const skutecneJmeno = document.createElement("p");
      const titul = document.createElement("p");
      const datum = document.createElement("p");
      const uroven = document.createElement("p");
      const xp = document.createElement("p");
      const popis = document.createElement("p");
      popis.id = "popis";
      jmeno.textContent = postava.nickname || postava.name;
      skutecneJmeno.textContent = "Postava: " + postava.name;
      titul.textContent = "Titul: " + (postava.title || "Bez titulu");
      datum.textContent = "Postava vytvořena: " + new Date(postava.created_at).toLocaleDateString("cs-CZ");
      uroven.textContent = "Úroveň: " + postava.level;
      xp.textContent = "XP: " + postava.total_xp;
      popis.textContent = postava.description || "Zatím bez popisu.";
      const obrazek = document.createElement("img");
      obrazek.className = "avatar";
      obrazek.alt = "Avatar postavy";
      if (postava.avatar_url) {
        obrazek.src = postava.avatar_url;
        karta.append(obrazek);
      }
      karta.append(jmeno, skutecneJmeno, titul, datum, uroven, xp, popis);
      const { data: hranice } = await client.from("levels")
        .select("level, required_xp").eq("is_active", true)
        .in("level", [postava.level, postava.level + 1]);
      const soucasna = hranice?.find(h => h.level === postava.level);
      const dalsi = hranice?.find(h => h.level === postava.level + 1);
      if (soucasna && dalsi) {
        const pruh = document.createElement("progress");
        pruh.max = Math.max(1, dalsi.required_xp - soucasna.required_xp);
        pruh.value = Math.max(0, Math.min(pruh.max, postava.total_xp - soucasna.required_xp));
        pruh.setAttribute("aria-label", "Postup k další úrovni");
        const zbyva = document.createElement("p");
        zbyva.textContent = postava.total_xp < soucasna.required_xp
          ? `Úroveň byla nastavena ručně. Do její hranice zbývá ${(soucasna.required_xp - postava.total_xp).toLocaleString("cs-CZ")} XP.`
          : `Do úrovně ${dalsi.level} zbývá ${Math.max(0, dalsi.required_xp - postava.total_xp).toLocaleString("cs-CZ")} XP`;
        xp.after(pruh, zbyva);
      }

      const formular = document.getElementById("upravitProfil");
      formular.style.display = "block";
      document.getElementById("prezdivka").value = postava.nickname || "";
      document.getElementById("popisProfilu").value = postava.description || "";
      formular.addEventListener("submit", async (udalost) => {
        udalost.preventDefault();
        const nickname = document.getElementById("prezdivka").value.trim();
        const description = document.getElementById("popisProfilu").value.trim();
        const stav = document.getElementById("stavProfilu");
        if (nickname && nickname.length < 2) {
          stav.textContent = "Přezdívka musí mít alespoň 2 znaky.";
          return;
        }
        const tlacitko = formular.querySelector("button");
        tlacitko.disabled = true;
        const { error: chybaUlozeni } = await client.from("characters")
          .update({ nickname: nickname || null, description: description || null })
          .eq("id", postava.id);
        tlacitko.disabled = false;
        if (chybaUlozeni) {
          stav.textContent = "Profil se nepodařilo uložit: " + chybaUlozeni.message;
          return;
        }
        jmeno.textContent = nickname || postava.name;
        popis.textContent = description || "Zatím bez popisu.";
        stav.textContent = "Profil byl uložen.";
      });

      const avatarFormular = document.getElementById("nahratAvatar");
      avatarFormular.style.display = "block";
      avatarFormular.addEventListener("submit", async (udalost) => {
        udalost.preventDefault();
        const soubor = document.getElementById("souborAvatara").files[0];
        const stav = document.getElementById("stavAvatara");
        if (!soubor) return;
        if (!["image/jpeg", "image/png", "image/webp"].includes(soubor.type) || soubor.size > 5 * 1024 * 1024) {
          stav.textContent = "Vyber obrázek JPG, PNG nebo WebP o velikosti nejvýše 5 MB.";
          return;
        }
        const tlacitko = avatarFormular.querySelector("button");
        tlacitko.disabled = true;
        stav.textContent = "Nahrávám avatar...";
        try {
          const puvodni = await createImageBitmap(soubor);
          const pomer = Math.min(1, 512 / Math.max(puvodni.width, puvodni.height));
          const platno = document.createElement("canvas");
          platno.width = Math.max(1, Math.round(puvodni.width * pomer));
          platno.height = Math.max(1, Math.round(puvodni.height * pomer));
          const kontext = platno.getContext("2d");
          if (!kontext) throw new Error("Obrázek nelze zpracovat.");
          kontext.fillStyle = "#ffffff";
          kontext.fillRect(0, 0, platno.width, platno.height);
          kontext.drawImage(puvodni, 0, 0, platno.width, platno.height);
          puvodni.close();
          const zmenseny = await new Promise((resolve, reject) => {
            platno.toBlob(blob => blob ? resolve(blob) : reject(new Error("Obrázek nelze zpracovat.")), "image/jpeg", 0.85);
          });
          const cesta = user.id + "/avatar.jpg";
          const { error: chybaNahrani } = await client.storage.from("avatars").upload(cesta, zmenseny, {
            contentType: "image/jpeg", upsert: true, cacheControl: "3600"
          });
          if (chybaNahrani) throw chybaNahrani;
          const { data: urlData } = client.storage.from("avatars").getPublicUrl(cesta);
          const url = urlData.publicUrl + "?v=" + Date.now();
          const { error: chybaProfilu } = await client.from("characters")
            .update({ avatar_url: url }).eq("id", postava.id);
          if (chybaProfilu) throw chybaProfilu;
          obrazek.src = url;
          if (!obrazek.isConnected) karta.prepend(obrazek);
          avatarFormular.reset();
          stav.textContent = "Avatar byl uložen.";
        } catch (chyba) {
          stav.textContent = "Avatar se nepodařilo uložit: " + chyba.message;
        } finally {
          tlacitko.disabled = false;
        }
      });
    }
    }
    document.getElementById("logout").addEventListener("click", async () => {
  await client.auth.signOut();
  window.location.href = "index.html";
});
    </script>

</body>
</html>
