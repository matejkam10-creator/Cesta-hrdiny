<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hráči | Cesta hrdiny</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin:0; min-height:100vh; font:18px Georgia,serif; color:#f4e4c4; background:#0d0c11 radial-gradient(circle at 12% 8%, #382b3b, transparent 32rem); }
    a { color:#f1d398; }
    header { position:relative; z-index:3; padding:18px; border-bottom:1px solid #5d4d38; background:#17131b; }
    .header-inner { max-width:1200px; margin:auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    header h1 { margin:0; color:#efd49b; font-size:clamp(24px,5vw,36px); }
    header h1 a { color:inherit; text-decoration:none; }
    #menuToggle { display:grid; place-items:center; width:48px; height:48px; border:1px solid #b69360; border-radius:10px; background:#302634; color:#f1d398; font:29px Georgia,serif; cursor:pointer; }
    #mainMenu { position:absolute; top:100%; right:18px; width:min(340px,calc(100vw - 36px)); padding:8px; border:1px solid #89704d; border-radius:0 0 14px 14px; background:#211b25; box-shadow:0 12px 28px #000a; }
    #mainMenu a { display:block; padding:12px 14px; border-bottom:1px solid #564535; text-decoration:none; }
    #mainMenu a:hover, #mainMenu button:hover, #mainMenu a:focus-visible, #mainMenu button:focus-visible { background:#3a2c36 !important; }
    main { max-width:900px; margin:34px auto; padding:0 18px; }
    main h1 { color:#efd49b; }
    .intro { color:#cdbd9e; line-height:1.5; }
    #players { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr)); gap:16px; margin-top:24px; }
    article { border:1px solid #68563f; border-radius:16px; background:#1b1720; padding:22px; overflow-wrap:anywhere; }
    .player-heading { display:flex; align-items:center; gap:14px; margin-bottom:10px; }
    .player-avatar { flex:none; display:grid; place-items:center; width:64px; height:64px; border:2px solid #e4c48a; border-radius:50%; background:#332a39; object-fit:cover; font-size:30px; }
    article h2 { margin:0 0 8px; color:#efd49b; font-size:1.25em; }
    article p { margin:8px 0; }
    .muted { color:#cdbd9e; }
    .player-link { display:flex; align-items:center; gap:14px; color:inherit; text-decoration:none; }
    .player-link:hover h2, .player-link:focus-visible h2 { text-decoration:underline; }
    .badge-row { margin:12px 0 0; }
    .level-badge { --accent:#a98248; --shade:#3b2b21; display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border:1px solid var(--accent); border-radius:999px; background:linear-gradient(125deg,var(--shade),#18131c); color:#fff4d9; box-shadow:inset 0 0 0 1px #fff2,0 3px 10px #0007; font:bold .82em Georgia,serif; letter-spacing:.02em; white-space:nowrap; }
    .level-badge::before { content:'✦'; color:var(--accent); font-size:1.2em; }
    .level-badge[data-rank="0"] { --accent:#a98248; --shade:#3b2b21; }
    .level-badge[data-rank="1"] { --accent:#abb7c4; --shade:#29333e; }
    .level-badge[data-rank="2"] { --accent:#e4bd61; --shade:#49361f; }
    .level-badge[data-rank="3"] { --accent:#70b4b4; --shade:#163d44; }
    .level-badge[data-rank="4"] { --accent:#bb8bdf; --shade:#372347; }
    .level-badge[data-rank="5"] { --accent:#ee9b6d; --shade:#4c292b; }
    .level-badge[data-rank="6"] { --accent:#9bca79; --shade:#31442c; }
    .level-badge[data-rank="7"] { --accent:#e6aab9; --shade:#472a3b; }
    .level-badge[data-rank="8"] { --accent:#b7c8ed; --shade:#303756; }
    .level-badge[data-rank="9"] { --accent:#f3cf88; --shade:#58402d; }

  </style>
</head>
<body>
  <header><div class="header-inner">
    <h1><a href="mapy.html">⚔️ Cesta hrdiny</a></h1>
    <button id="menuToggle" type="button" aria-label="Otevřít nabídku" aria-controls="mainMenu" aria-expanded="false">☰</button>
    <nav id="mainMenu" aria-label="Hlavní nabídka" hidden><a href="mapy.html">Mapy</a><a href="postava.html">Moje postava</a><a href="urovne.html">Úrovně</a><a href="historie.html">Moje úkoly</a><a href="chat.html">Společný chat</a><a href="druziny.html">Družiny</a><a id="adminLink" href="admin-ukoly.html" hidden>Kontrola úkolů</a></nav>
  </div></header>
  <main>
    <h1>Hráči</h1>
    <p class="intro">Postavy, které potkáš v Cestě hrdiny. Klepni na postavu a prohlédni si její profil.</p>
    <p id="status" role="status">Načítám postavy...</p>
    <div id="players"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const menu = document.getElementById('mainMenu');
    const toggle = document.getElementById('menuToggle');
    toggle.addEventListener('click', () => {
      menu.hidden = !menu.hidden;
      toggle.setAttribute('aria-expanded', String(!menu.hidden));
    });
    const client = supabase.createClient('https://qgnallfqanixepfvrzjn.supabase.co', 'sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi');
    (async () => {
      const { data: { user }, error: authError } = await client.auth.getUser();
      if (authError || !user) { location.replace('index.html'); return; }
      const [{ data, error }, { data: isAdmin }] = await Promise.all([
        client.rpc('list_player_characters'), client.rpc('is_admin')
      ]);
      if (isAdmin) document.getElementById('adminLink').hidden = false;
      const status = document.getElementById('status');
      if (error || !Array.isArray(data)) { status.textContent = 'Seznam hráčů se nepodařilo načíst.'; return; }
      if (!data.length) { status.textContent = 'Zatím tu nejsou žádné postavy.'; return; }
      status.textContent = `Postav: ${data.length}`;
      const list = document.getElementById('players');
      const avatarBase = 'https://qgnallfqanixepfvrzjn.supabase.co/storage/v1/object/public/avatars/';
      function avatarFor(url) {
        const fallback = () => {
          const icon = document.createElement('span');
          icon.className = 'player-avatar';
          icon.textContent = '👤';
          icon.setAttribute('aria-hidden', 'true');
          return icon;
        };
        if (typeof url !== 'string' || !url.startsWith(avatarBase)) return fallback();
        const picture = document.createElement('img');
        picture.className = 'player-avatar';
        picture.src = url;
        picture.alt = '';
        picture.loading = 'lazy';
        picture.addEventListener('error', () => picture.replaceWith(fallback()), { once: true });
        return picture;
      }

      function levelBadge(value) {
        const level = Math.max(1, Math.floor(Number(value) || 1));
        const band = level < 10 ? 0 : Math.floor(level / 10);
        const range = band === 0 ? '1–9' : `${band * 10}–${band * 10 + 9}`;
        const badge = document.createElement('span');
        badge.className = 'level-badge';
        badge.dataset.rank = String(band % 10);
        badge.textContent = `Úroveň ${level} · ${range}`;
        badge.setAttribute('aria-label', `Úroveň ${level}, pásmo ${range}`);
        return badge;
      }
      for (const character of data) {
        const card = document.createElement('article');
        const heading = document.createElement('div');
        heading.className = 'player-heading';
        const name = document.createElement('h2');
        name.textContent = character.nickname || character.name || 'Bezejmenná postava';
        const link = document.createElement('a');
        link.className = 'player-link';
        link.href = 'profil.html?id=' + encodeURIComponent(character.id);
        link.append(avatarFor(character.avatar_url), name);
        heading.append(link);
        card.append(heading);
        if (character.nickname && character.name && character.nickname !== character.name) {
          const gameName = document.createElement('p');
          gameName.className = 'muted';
          gameName.textContent = `Herní jméno: ${character.name}`;
          card.append(gameName);
        }
        const info = document.createElement('p');
        info.textContent = character.title || 'Bez titulu';
        card.append(info);
        const rank = document.createElement('p');
        rank.className = 'badge-row';
        rank.append(levelBadge(character.level));
        card.append(rank);
        list.append(card);
      }
    })();
  </script>
  <script src="navigace.js" defer></script>
</body>
</html>
