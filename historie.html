<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moje úkoly | Cesta hrdiny</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; background: #0d0c11; color: #f4e4c4; font-family: Georgia, serif; }
    main { max-width: 850px; margin: 24px auto; padding: 0 16px 50px; }
    h1, h2 { color: #efd49b; }
    a { color: #efd49b; }
    .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
    button { padding: 10px 16px; border: 1px solid #806a4b; border-radius: 9px; background: #26202a; color: #f4e4c4; font: inherit; cursor: pointer; }
    button[aria-selected="true"] { background: #866333; border-color: #e3be7c; }
    .category { margin-top: 30px; }
    .category h2 { margin: 0 0 12px; color: #efd49b; }
    .card { margin: 12px 0; padding: 0; border: 1px solid #6a573f; border-radius: 16px; background: #1b1720; }
    .card summary { padding: 18px 20px; color: #efd49b; font-size: 1.15em; font-weight: bold; cursor: pointer; }
    .card summary:focus-visible { outline: 2px solid #efd49b; outline-offset: -4px; }
    .card[open] { padding: 0 20px 20px; }
    .card[open] summary { margin: 0 -20px 14px; border-bottom: 1px solid #6a573f; }
    .meta { color: #cdbd9e; }
    .answer, .comment { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; padding: 12px; border: 1px solid #544b42; border-radius: 8px; background: #141218; }
    .comment { border-color: #9a7354; }
    .photos a { display: block; margin: 9px 0; }
    .approved { color: #a6dab1; }
    .returned { color: #edbc9c; }
    .pending { color: #efd49b; }
    .card textarea, .card input[type="file"] { display: block; width: 100%; margin: 10px 0; padding: 12px; border: 1px solid #806a4b; border-radius: 8px; background: #141218; color: #f4e4c4; font: inherit; }
    .card textarea { min-height: 120px; }

    /* Stejná hlavička a nabídka jako na mapách. */
    [hidden] { display: none !important; }
    .site-header { font-size: 16px; position: relative; z-index: 3; padding: 18px; border-bottom: 1px solid #5d4d38; background: #17131b; }
    .site-header .header-inner { max-width: 1200px; margin: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .site-header h1 { margin: 0; color: #efd49b; font-size: clamp(24px, 5vw, 36px); }
    .site-header h1 a { color: inherit; text-decoration: none; }
    .site-header h1 a:hover, .site-header h1 a:focus-visible { text-decoration: underline; }
    .site-header #menuToggle { display: grid; place-items: center; width: 48px; height: 48px; margin: 0; padding: 0; border: 1px solid #b69360; border-radius: 10px; background: #302634; color: #f1d398; font: inherit; font-size: 29px; line-height: 1; cursor: pointer; }
    .site-header #mainMenu { display: block; position: absolute; top: 100%; right: 18px; width: min(340px, calc(100vw - 36px)); margin: 0; padding: 8px; border: 1px solid #89704d; border-radius: 0 0 14px 14px; background: #211b25; box-shadow: 0 12px 28px #000a; }
    .site-header #mainMenu a { display: block; padding: 12px 14px; border-bottom: 1px solid #564535; text-decoration: none; }
    .site-header #mainMenu a:last-child { border-bottom: 0; }
    .site-header #mainMenu a:hover, .site-header #mainMenu a:focus-visible { background: #3a2c36; text-decoration: underline; }
  </style>
</head>
<body>
<header class="site-header"><div class="header-inner">
    <h1><a href="mapy.html">⚔️ Cesta hrdiny</a></h1>
    <button id="menuToggle" type="button" aria-label="Otevřít nabídku" aria-controls="mainMenu" aria-expanded="false">☰</button>
    <nav id="mainMenu" aria-label="Hlavní nabídka" hidden><a href="mapy.html">Mapy</a><a href="postava.html">Moje postava</a><a href="urovne.html">Úrovně</a><a href="historie.html">Moje úkoly</a><a href="chat.html">Společný chat</a><a href="druziny.html">Družiny</a><a id="adminLink" href="admin-ukoly.html" hidden>Kontrola úkolů</a></nav>
  </div></header>

  <main>
    <h1>Moje úkoly</h1>
    <p id="status" role="status">Načítám přijaté a odevzdané úkoly...</p>
    <div class="tabs" role="tablist" aria-label="Druh úkolů">
      <button id="personalTab" type="button" role="tab" aria-selected="true" aria-controls="personalList">Osobní úkoly</button>
      <button id="groupTab" type="button" role="tab" aria-selected="false" aria-controls="groupList">Družinové úkoly</button>
    </div>
    <section id="personalList" role="tabpanel" aria-labelledby="personalTab"></section>
    <section id="groupList" role="tabpanel" aria-labelledby="groupTab" hidden></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const menuButton = document.getElementById("menuToggle");
    const menu = document.getElementById("mainMenu");
    function closeMenu() {
      menu.hidden = true;
      menuButton.setAttribute("aria-expanded", "false");
      menuButton.setAttribute("aria-label", "Otevřít nabídku");
    }
    menuButton.addEventListener("click", () => {
      const opening = menu.hidden;
      menu.hidden = !opening;
      menuButton.setAttribute("aria-expanded", String(opening));
      menuButton.setAttribute("aria-label", opening ? "Zavřít nabídku" : "Otevřít nabídku");
    });
    document.addEventListener("keydown", event => { if (event.key === "Escape") closeMenu(); });
    document.addEventListener("pointerdown", event => {
      if (!menu.hidden && !menu.contains(event.target) && !menuButton.contains(event.target)) closeMenu();
    });
    supabase.createClient("https://qgnallfqanixepfvrzjn.supabase.co", "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi")
      .rpc("is_admin").then(({ data }) => { if (data) document.getElementById("adminLink").hidden = false; });
  </script>

  <script type="module">
    const client = supabase.createClient("https://qgnallfqanixepfvrzjn.supabase.co", "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi");
    const status = document.getElementById("status");
    const personalList = document.getElementById("personalList");
    const groupList = document.getElementById("groupList");
    const personalTab = document.getElementById("personalTab");
    const groupTab = document.getElementById("groupTab");
    function selectTab(group) {
      personalList.hidden = group;
      groupList.hidden = !group;
      personalTab.setAttribute("aria-selected", String(!group));
      groupTab.setAttribute("aria-selected", String(group));
    }
    personalTab.addEventListener("click", () => selectTab(false));
    groupTab.addEventListener("click", () => selectTab(true));
    function makeCategories(parent) {
      const result = {};
      for (const [key, title] of [["accepted", "Přijaté úkoly"], ["approved", "Splněné úkoly"], ["returned", "Vrácené úkoly"]]) {
        const section = document.createElement("section");
        section.className = "category";
        const heading = document.createElement("h2");
        heading.textContent = title;
        const items = document.createElement("div");
        section.append(heading, items);
        parent.append(section);
        result[key] = items;
      }
      return result;
    }

    function appendPhotos(card, paths) {
      if (!paths.length) return;
      const links = document.createElement("div");
      links.className = "photos";
      paths.forEach((path, index) => {
        const link = document.createElement("a");
        link.href = "#";
        link.textContent = `Zobrazit fotku ${index + 1}`;
        link.addEventListener("click", async event => {
          event.preventDefault();
          const { data, error } = await client.storage.from("quest-evidence").createSignedUrl(path, 300);
          if (error) status.textContent = "Fotku se nepodařilo otevřít: " + error.message;
          else window.open(data.signedUrl, "_blank", "noopener,noreferrer");
        });
        links.append(link);
      });
      card.append(links);
    }
    function appendCard(container, item) {
      const card = document.createElement("details");
      card.className = "card";
      const heading = document.createElement("summary");
      heading.textContent = item.title;
      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = `${new Date(item.created_at).toLocaleString("cs-CZ")} · Odměna úkolu: ${item.xp_reward} XP`;
      const state = document.createElement("p");
      state.className = item.status;
      state.textContent = ({ pending: "Čeká na schválení", approved: "Schváleno", returned: "Vráceno k opravě" })[item.status] || item.status;
      const answer = document.createElement("p");
      answer.className = "answer";
      answer.textContent = item.answer || "Bez textu";
      card.append(heading, meta, state, answer);
      if (item.review_comment) {
        const label = document.createElement("strong");
        label.textContent = "Komentář admina:";
        const comment = document.createElement("p");
        comment.className = "comment";
        comment.textContent = item.review_comment;
        card.append(label, comment);
      }
      appendPhotos(card, item.photos);
      container.append(card);
    }
    function fileMap(files, key) {
      const result = new Map();
      for (const file of files) {
        if (!result.has(file[key])) result.set(file[key], []);
        result.get(file[key]).push(file.file_url);
      }
      return result;
    }
    async function selectMany(table, columns, column, ids, orderColumn) {
      if (!ids.length) return [];
      let query = client.from(table).select(columns).in(column, ids);
      if (orderColumn) query = query.order(orderColumn, { ascending: true });
      const { data, error } = await query;
      if (error) throw new Error(`${table}: ${error.message}`);
      return data || [];
    }
    function evidenceFor(name) {
      const special = {
        "Tři ilustrace pro Felisku": [4],
        "Pět výher v Tchoříčkách": [1, 2, 3, 4, 5],
        "Pět výher v Řachavém Petrovi": [1, 2, 3, 4, 5],
        "Pět výher v Maškvorkách": [1, 2, 3, 4, 5],
        "Kalkulátor": [1, 2, 3, 4, 5],
        "Matematikář": [1, 2, 3, 4, 5],
        "Ďáblova jáma: jeden týden": [1],
        "Ďáblova jáma: tři týdny": [3],
        "Ďáblova jáma: pět týdnů": [5],
        "Pět zápasů v soubojovém klubu": [1, 2],
        "Najdi místo pro arénu": [3],
        "Pět vítězství v soubojovém klubu": [4, 5],
        "Příběh gladiátorských soubojů": [0],
        "Pět nových kouzel": [3, 5],
        "Malý cestovatel": [3],
        "Hodina tělocviku": [2],
        "Starání se o mazlíčky Krále zvěře": [5],
        "To už jsme smečka?": [5],
        "Trénování je moje vášeň": [0, 4]
      };
      return special[name] || [1];
    }
    const locationPages = {
      kuchyne: "kuchyne.html", knihovna: "knihovna.html", herna: "herna.html",
      arena: "arena.html", bazina: "bazina.html", louka: "louka.html", sklad: "sklad.html", stanek: "stanek.html",
      kral_zvere: "kral-zvere.html", placek: "placek.html"
    };
    async function attachEvidence(submissionId, files, note) {
      for (let index = 0; index < files.length; index++) {
        note.textContent = `Nahrávám obrázek ${index + 1} z ${files.length}...`;
        const source = await createImageBitmap(files[index]);
        let blob;
        try {
          const scale = Math.min(1, 1600 / Math.max(source.width, source.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(source.width * scale));
          canvas.height = Math.max(1, Math.round(source.height * scale));
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
          blob = await new Promise((resolve, reject) => canvas.toBlob(
            data => data ? resolve(data) : reject(new Error("Obrázek se nepodařilo zpracovat.")), "image/jpeg", .85
          ));
        } finally { source.close(); }
        if (blob.size > 5 * 1024 * 1024) throw new Error("Obrázek je příliš velký.");
        const path = (await client.auth.getUser()).data.user.id + "/" + crypto.randomUUID() + ".jpg";
        const { error: uploadError } = await client.storage.from("quest-evidence")
          .upload(path, blob, { contentType: "image/jpeg", upsert: false });
        if (uploadError) throw uploadError;
        const { error: attachError } = await client.rpc("attach_personal_photo", {
          p_submission_id: submissionId, p_file_path: path
        });
        if (attachError) throw attachError;
      }
    }
    function appendAcceptedCard(container, quest, acceptedAt, character, latest) {
      const card = document.createElement("details");
      card.className = "card";
      const title = document.createElement("summary");
      title.textContent = quest.name + (["louka", "sklad", "stanek"].includes(quest.location_key)
        ? " · " + ({ easy: "lehký", medium: "střední", hard: "těžký" })[quest.difficulty] : "");
      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = `Přijato ${new Date(acceptedAt).toLocaleString("cs-CZ")} · ${quest.xp_reward} XP · od úrovně ${quest.required_level}`;
      const description = document.createElement("p");
      description.className = "answer";
      description.textContent = quest.description;
      const note = document.createElement("p");
      note.className = "pending";
      note.setAttribute("role", "status");
      const link = document.createElement("a");
      link.href = locationPages[quest.location_key] || "mapy.html";
      link.textContent = "Zobrazit místo na mapě";
      card.append(title, meta, description, link, note);
      if (latest?.status === "returned" && latest.review_comment) {
        const comment = document.createElement("p");
        comment.className = "comment";
        comment.textContent = "Komentář admina: " + latest.review_comment;
        card.append(comment);
      }
      if (latest?.text_content) {
        const previous = document.createElement("p");
        previous.className = "answer";
        previous.textContent = "Poslední vypracování: " + latest.text_content;
        card.append(previous);
      }
      if (latest?.photos?.length) appendPhotos(card, latest.photos);
      const allowed = evidenceFor(quest.name);
      const min = Math.min(...allowed), max = Math.max(...allowed);
      const form = document.createElement("form");
      const label = document.createElement("label");
      label.textContent = "Vypracování úkolu (10–5000 znaků)";
      const answer = document.createElement("textarea");
      answer.minLength = 10; answer.maxLength = 5000; answer.required = true;
      label.append(answer);
      const fileLabel = document.createElement("label");
      fileLabel.textContent = allowed.length > 1
        ? (min === 1 && max === 5 ? "Printy či fotografie: 1–5" : `Printy či fotografie: podle varianty ${allowed.join(" nebo ")}`)
        : `Printy či fotografie: ${max}`;
      const fileInput = document.createElement("input");
      fileInput.type = "file"; fileInput.multiple = true;
      fileInput.accept = "image/jpeg,image/png,image/webp";
      fileLabel.append(fileInput);
      fileLabel.hidden = max === 0;
      const submit = document.createElement("button");
      submit.type = "submit"; submit.textContent = "Odevzdat řešení";
      form.append(label, fileLabel, submit);
      const pending = latest?.status === "pending";
      if (pending) {
        const count = latest.photos.length;
        note.textContent = `Řešení čeká na schválení. Přiloženo ${count} obrázků.`;
        if (max > count) {
          const add = document.createElement("button");
          add.type = "button"; add.textContent = "Doplnit obrázky";
          card.append(fileLabel, add);
          add.addEventListener("click", async () => {
            const files = Array.from(fileInput.files);
            if (!files.length || count + files.length > max) {
              note.textContent = `Vyber 1 až ${max - count} obrázků.`; return;
            }
            add.disabled = true;
            try { await attachEvidence(latest.id, files, note); location.reload(); }
            catch (error) { note.textContent = "Přílohy se nepodařilo přidat: " + error.message; add.disabled = false; }
          });
        }
      } else if (quest.is_active && character.level >= quest.required_level) {
        note.textContent = latest?.status === "returned" ? "Předchozí řešení bylo vráceno. Můžeš ho opravit." : "Přijatý úkol připravený k plnění.";
        card.append(form);
        form.addEventListener("submit", async event => {
          event.preventDefault();
          const files = Array.from(fileInput.files);
          if (!allowed.includes(files.length)) {
            note.textContent = `Přilož ${allowed.join(" nebo ")} obrázků podle zadání.`; return;
          }
          if (files.some(file => !["image/jpeg", "image/png", "image/webp"].includes(file.type) || file.size > 5 * 1024 * 1024)) {
            note.textContent = "Každý obrázek musí být JPG, PNG nebo WebP do 5 MB."; return;
          }
          submit.disabled = true;
          note.textContent = "Odevzdávám řešení...";
          const { data: submissionId, error } = await client.rpc("submit_personal_quest", {
            p_quest_id: quest.id, p_text: answer.value.trim()
          });
          if (error) { note.textContent = error.message; submit.disabled = false; return; }
          form.hidden = true;
          try { await attachEvidence(submissionId, files, note); location.reload(); }
          catch (uploadError) {
            note.textContent = "Řešení je odevzdané, ale nahrání obrázků selhalo: " + uploadError.message + ". Obnov stránku a doplň je.";
          }
        });
      } else note.textContent = "Úkol již není dostupný k odevzdání.";
      container.append(card);
    }
    const { data: { user }, error: authError } = await client.auth.getUser();
    if (authError || !user) location.replace("index.html");
    else try {
      const { data: character, error: characterError } = await client.from("characters")
        .select("id, level").eq("user_id", user.id).single();
      if (characterError || !character) throw new Error("Postavu se nepodařilo načíst.");
      const [{ data: assignments, error: aError }, { data: memberships, error: mError }, { data: accepted, error: acceptedError }] = await Promise.all([
        client.from("quest_assignments").select("id, quest_id").eq("character_id", character.id),
        client.from("group_members").select("group_id").eq("character_id", character.id),
        client.from("accepted_quests").select("quest_id, accepted_at").eq("character_id", character.id).order("accepted_at", { ascending: false })
      ]);
      if (aError || mError || acceptedError) throw new Error("Úkoly se nepodařilo načíst: " + (aError || mError || acceptedError).message);
      const groupIds = [...new Set(memberships.map(m => m.group_id))];
      const [personal, grouped, groups] = await Promise.all([
        selectMany("submissions", "id, assignment_id, text_content, status, review_comment, created_at", "assignment_id", assignments.map(a => a.id)),
        selectMany("group_submissions", "id, group_id, quest_id, answer, status, review_comment, created_at", "group_id", groupIds),
        selectMany("groups", "id, name", "id", groupIds)
      ]);
      const questIds = [...new Set([...assignments.map(a => a.quest_id), ...grouped.map(s => s.quest_id), ...accepted.map(a => a.quest_id)])];
      const [quests, personalPhotos, groupPhotos] = await Promise.all([
        selectMany("quests", "id, name, description, difficulty, xp_reward, required_level, is_active, location_key, map_id", "id", questIds),
        selectMany("submission_files", "submission_id, file_url", "submission_id", personal.map(s => s.id), "uploaded_at"),
        selectMany("group_submission_files", "group_submission_id, file_url", "group_submission_id", grouped.map(s => s.id), "uploaded_at")
      ]);
      const assignmentById = new Map(assignments.map(a => [a.id, a]));
      const questById = new Map(quests.map(q => [q.id, q]));
      const groupById = new Map(groups.map(g => [g.id, g]));
      const personalFileMap = fileMap(personalPhotos, "submission_id");
      const groupFileMap = fileMap(groupPhotos, "group_submission_id");
      personal.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      grouped.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      const latestByQuest = new Map();
      for (const s of personal) {
        const questId = assignmentById.get(s.assignment_id)?.quest_id;
        if (questId && !latestByQuest.has(questId)) {
          latestByQuest.set(questId, { ...s, photos: personalFileMap.get(s.id) || [] });
        }
      }
      const personalSections = makeCategories(personalList);
      const groupSections = makeCategories(groupList);
      const approvedQuestIds = new Set(personal.filter(s => s.status === "approved")
        .map(s => assignmentById.get(s.assignment_id)?.quest_id));
      const acceptedIds = new Set(accepted.map(a => a.quest_id));
      let activeCount = 0;
      for (const entry of accepted) {
        const quest = questById.get(entry.quest_id);
        const latest = latestByQuest.get(entry.quest_id);
        if (!quest || approvedQuestIds.has(entry.quest_id)) continue;
        appendAcceptedCard(latest?.status === "returned" ? personalSections.returned : personalSections.accepted,
          quest, entry.accepted_at, character, latest);
        activeCount++;
      }
      const displayedPersonal = new Set();
      for (const s of [...personal.filter(s => s.status === "approved"), ...personal.filter(s => s.status !== "approved")]) {
        const questId = assignmentById.get(s.assignment_id)?.quest_id;
        if (!questId || displayedPersonal.has(questId)) continue;
        displayedPersonal.add(questId);
        if (acceptedIds.has(questId) && !approvedQuestIds.has(questId)) continue;
        const quest = questById.get(questId);
        const target = s.status === "approved" ? personalSections.approved
          : s.status === "returned" ? personalSections.returned : personalSections.accepted;
        appendCard(target, {
          title: quest ? quest.name + (["louka", "sklad", "stanek"].includes(quest.location_key)
            ? " · " + ({ easy: "lehký", medium: "střední", hard: "těžký" })[quest.difficulty] : "") : "Osobní úkol",
          xp_reward: quest?.xp_reward ?? 0,
          created_at: s.created_at, status: s.status, answer: s.text_content,
          review_comment: s.review_comment, photos: personalFileMap.get(s.id) || []
        });
      }
      const displayedGroup = new Set();
      for (const s of [...grouped.filter(s => s.status === "approved"), ...grouped.filter(s => s.status !== "approved")]) {
        const key = s.group_id + ":" + s.quest_id;
        if (displayedGroup.has(key)) continue;
        displayedGroup.add(key);
        const quest = questById.get(s.quest_id);
        const target = s.status === "approved" ? groupSections.approved
          : s.status === "returned" ? groupSections.returned : groupSections.accepted;
        appendCard(target, {
          title: (groupById.get(s.group_id)?.name || "Družina") + " · " + (quest?.name || "Úkol"),
          xp_reward: quest?.xp_reward ?? 0, created_at: s.created_at, status: s.status,
          answer: s.answer, review_comment: s.review_comment,
          photos: groupFileMap.get(s.id) || []
        });
      }
      for (const sections of [personalSections, groupSections]) {
        for (const items of Object.values(sections)) {
          if (!items.children.length) {
            const empty = document.createElement("p");
            empty.className = "meta";
            empty.textContent = "Zatím žádné úkoly.";
            items.append(empty);
          }
        }
      }
      status.textContent = `Přijaté úkoly k plnění: ${activeCount} · Osobní řešení: ${personal.length} · Družinová řešení: ${grouped.length}`;
    } catch (error) {
      status.textContent = "Historii úkolů se nepodařilo načíst: " + error.message;
    }
  </script>
  <script src="navigace.js" defer></script>
</body>
</html>
