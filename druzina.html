<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Družina | Cesta hrdiny</title>
</head>

<body style="background:#0b0910;color:#e8c77a;text-align:center;padding:50px;font-family:serif;">

  <h1>⚔️ Cesta hrdiny</h1>
  <h2 id="nazevDruziny">Načítám družinu...</h2>

  <div id="obsahDruziny"></div>
  <textarea id="novyPopis" style="display:none"></textarea>
  <button id="ulozitPopis" style="display:none">Uložit popis</button>
  <h3>Členové družiny</h3>
  <button id="pridatClena" style="display:none">Přidat člena</button>
  <div id="pridatClenaForm" style="display:none;">
    <input id="jmenoNovehoClena" placeholder="Jméno postavy">
    <button id="potvrditPridani">Přidat</button>
  </div>
<div id="clenove">Načítám členy...</div>

<section id="chatDruziny" style="display:none;max-width:600px;margin:30px auto;">
  <h3>Chat družiny</h3>
  <div id="zpravy" aria-live="polite">Načítám zprávy...</div>
  <button id="obnovitZpravy" type="button">Obnovit zprávy</button>
  <form id="odeslatZpravu">
    <textarea id="textZpravy" required maxlength="1000" placeholder="Napiš zprávu" style="width:100%;min-height:80px;margin-top:16px;"></textarea>
    <button type="submit">Odeslat zprávu</button>
  </form>
  <p id="stavZpravy" role="status"></p>
</section>

  <p><a href="druziny.html" style="color:#e8c77a;">← Zpět na moje družiny</a></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
const SUPABASE_URL = "https://qgnallfqanixepfvrzjn.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const params = new URLSearchParams(window.location.search);
const groupId = params.get("id");
    const { data: { user } } = await client.auth.getUser();

if (!user) {
  window.location.href = "index.html";
}
 const { data: postava } = await client  
      .from("characters")
    .select("id")
    .eq("user_id", user.id)
    .single();
    const { data: druzina, error } = await client
  .from("groups")
  .select("id, name, description")
  .eq("id", groupId)
  .single();
    if (error) {
  document.getElementById("nazevDruziny").textContent =
    "Družinu se nepodařilo načíst.";
} else {
  document.getElementById("nazevDruziny").textContent = druzina.name;
  document.getElementById("obsahDruziny").textContent =
    druzina.description || "Družina zatím nemá popis.";
      document.getElementById("novyPopis").value = druzina.description || "";
    }
    const { data: clenove, error: clenoveError } = await client
  .from("group_members")
  .select("character_id, role")
  .eq("group_id", groupId);
    if (clenoveError) {
  document.getElementById("clenove").textContent =
    "Členy se nepodařilo načíst.";
    }
    if (!clenoveError && clenove.length === 0) {
  document.getElementById("clenove").textContent =
    "Družina zatím nemá žádné členy.";
    }
    if (!clenoveError && clenove.length > 0) {
    const jeKapitan = clenove.some(c => c.role === "captain" && c.character_id === postava.id);
    if (jeKapitan) {
    document.getElementById("pridatClena").style.display = "inline-block";
    
    document.getElementById("novyPopis").style.display = "inline-block";
    document.getElementById("ulozitPopis").style.display = "inline-block";
    }
  const idsClenu = clenove.map(c => c.character_id);

  const { data: postavyClenu, error: postavyError } = await client
    .from("characters")
    .select("id, name")
    .in("id", idsClenu);
      if (postavyError) {
  document.getElementById("clenove").textContent =
    "Jména členů se nepodařilo načíst.";
      }
        if (!postavyError) {
  const seznamClenu = document.getElementById("clenove");
  seznamClenu.replaceChildren();
  for (const p of postavyClenu) {
    const role = clenove.find(c => c.character_id === p.id)?.role;
    const radek = document.createElement("p");
    radek.textContent = "👤 " + p.name + " — " + (role === "captain" ? "Kapitán" : "Člen");
    if (jeKapitan && role !== "captain") {
      const tlacitko = document.createElement("button");
      tlacitko.className = "odebratClena";
      tlacitko.dataset.id = p.id;
      tlacitko.textContent = "Odebrat";
      radek.append(" ", tlacitko);
    }
    seznamClenu.append(radek);
  }

  if (clenove.some(c => c.character_id === postava.id)) {
    document.getElementById("chatDruziny").style.display = "block";
    const jmena = new Map(postavyClenu.map(p => [p.id, p.name]));
    const vypisZprav = document.getElementById("zpravy");
    const stavZpravy = document.getElementById("stavZpravy");

    async function nacistZpravy() {
      const { data: zpravy, error: chybaZprav } = await client
        .from("messages")
        .select("id, character_id, message, created_at")
        .eq("group_id", groupId)
        .eq("is_deleted", false)
        .order("created_at", { ascending: false })
        .limit(50);
      if (chybaZprav) {
        vypisZprav.textContent = "Zprávy se nepodařilo načíst.";
        return;
      }
      vypisZprav.replaceChildren();
      if (zpravy.length === 0) {
        vypisZprav.textContent = "Zatím tu nejsou žádné zprávy.";
      }
      for (const zprava of [...zpravy].reverse()) {
        const radek = document.createElement("p");
        radek.style.cssText = "text-align:left;border-bottom:1px solid #554a40;padding:8px;overflow-wrap:anywhere";
        const autor = document.createElement("strong");
        autor.textContent = jmena.get(zprava.character_id) || "Člen družiny";
        const cas = document.createElement("small");
        cas.textContent = " · " + new Date(zprava.created_at).toLocaleString("cs-CZ");
        const text = document.createElement("div");
        text.textContent = zprava.message;
        radek.append(autor, cas, text);
        vypisZprav.append(radek);
      }
    }

    document.getElementById("obnovitZpravy").addEventListener("click", nacistZpravy);
    document.getElementById("odeslatZpravu").addEventListener("submit", async (udalost) => {
      udalost.preventDefault();
      const pole = document.getElementById("textZpravy");
      const zprava = pole.value.trim();
      if (!zprava) return;
      const tlacitko = udalost.currentTarget.querySelector("button");
      tlacitko.disabled = true;
      const { error: chybaOdeslani } = await client.from("messages").insert({
        group_id: groupId,
        character_id: postava.id,
        message: zprava
      });
      tlacitko.disabled = false;
      if (chybaOdeslani) {
        stavZpravy.textContent = "Zprávu se nepodařilo odeslat: " + chybaOdeslani.message;
        return;
      }
      pole.value = "";
      stavZpravy.textContent = "Zpráva byla odeslána.";
      await nacistZpravy();
    });
    await nacistZpravy();
  }
         
        
      }
    }
    console.log("Družina načtena správně");
    document.getElementById("ulozitPopis").addEventListener("click", async () => {
      const novyPopis = document.getElementById("novyPopis").value.trim();
      const { error: chybaPopisu } = await client
  .from("groups")
  .update({ description: novyPopis })
  .eq("id", groupId);
      if (chybaPopisu) {
  alert("Popis se nepodařilo uložit.");
  return;
      }
      alert("Popis byl uložen.");
      location.reload();
    
});
    document.getElementById("pridatClena").addEventListener("click", () => {
      document.getElementById("pridatClenaForm").style.display = "block";
    });
    document.getElementById("potvrditPridani").addEventListener("click", async () => {
      const jmeno = document.getElementById("jmenoNovehoClena").value.trim();
      if (!jmeno) return;
      const { data: hledanaPostava, error: chybaHledani } = await client.rpc("find_character_by_name", { search_name: jmeno });
      if (chybaHledani || !hledanaPostava || hledanaPostava.length === 0) {
          alert("Postava nebyla nalezena.");
          return;
      }
      const { error: chybaPridani } = await client
        .from("group_members")
        .insert({
              group_id: groupId,
              character_id: hledanaPostava[0].id,
              role: "member"
                  });
      if (chybaPridani) {
          alert("Chyba: " + chybaPridani.message);
          return;
      }
      alert("Člen byl přidán.");
      location.reload();
      });
   document.getElementById("clenove").addEventListener("click", async (e) => {
  if (!e.target.classList.contains("odebratClena")) return;

  const characterId = e.target.dataset.id;
     if (!confirm("Opravdu chceš tohoto člena odebrat z družiny?")) return;

  const { error } = await client
    .from("group_members")
    .delete()
    .eq("group_id", groupId)
    .eq("character_id", characterId);

  if (error) {
    alert("Člena se nepodařilo odebrat.");
    return;
  }

  alert("Člen byl odebrán.");
  location.reload();
}); 
  </script>
</body>
</html>
