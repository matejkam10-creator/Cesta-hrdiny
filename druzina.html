<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Družina | Cesta hrdiny</title>
</head>

<body style="background:#0b0910;color:#e8c77a;text-align:center;padding:50px;font-family:serif;">

  <h1>⚔️ Cesta hrdiny</h1>
  <h2 id="nazevDruziny">Načítám družinu...</h2>

  <div id="obsahDruziny"></div>
  <textarea id="novyPopis" style="display:none"></textarea>
  <button id="ulozitPopis" style="display:none">Uložit popis</button>
  <h3>Členové družiny</h3>
  <button id="pridatClena">Přidat člena</button>
<div id="clenove">Načítám členy...</div>

  <p><a href="druziny.html" style="color:#e8c77a;">← Zpět na moje družiny</a></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
const SUPABASE_URL = "https://qgnallfqanixepfvrzjn.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const params = new URLSearchParams(window.location.search);
const groupId = params.get("id");
    const { data: { user } } = await client.auth.getUser();

if (!user) {
  window.location.href = "index.html";
}
 const { data: postava } = await client  
      .from("characters")
    .select("id")
    .eq("user_id", user.id)
    .single();
    const { data: druzina, error } = await client
  .from("groups")
  .select("id, name, description")
  .eq("id", groupId)
  .single();
    if (error) {
  document.getElementById("nazevDruziny").textContent =
    "Družinu se nepodařilo načíst.";
} else {
  document.getElementById("nazevDruziny").textContent = druzina.name;
  document.getElementById("obsahDruziny").textContent =
    druzina.description || "Družina zatím nemá popis.";
      document.getElementById("novyPopis").value = druzina.description || "";
    }
    const { data: clenove, error: clenoveError } = await client
  .from("group_members")
  .select("character_id, role")
  .eq("group_id", groupId);
    if (clenoveError) {
  document.getElementById("clenove").textContent =
    "Členy se nepodařilo načíst.";
    }
    if (!clenoveError && clenove.length === 0) {
  document.getElementById("clenove").textContent =
    "Družina zatím nemá žádné členy.";
    }
    if (!clenoveError && clenove.length > 0) {
    const jeKapitan = clenove.some(c => c.role === "captain" && c.character_id === postava.id);
    if (jeKapitan) {
    
    document.getElementById("novyPopis").style.display = "inline-block";
    document.getElementById("ulozitPopis").style.display = "inline-block";
    }
  const idsClenu = clenove.map(c => c.character_id);

  const { data: postavyClenu, error: postavyError } = await client
    .from("characters")
    .select("id, name")
    .in("id", idsClenu);
      if (postavyError) {
  document.getElementById("clenove").textContent =
    "Jména členů se nepodařilo načíst.";
      }
        if (!postavyError) {
  document.getElementById("clenove").innerHTML =
    postavyClenu.map(p => "<p>👤 " + p.name + " — " + (clenove.find(c => c.character_id === p.id)?.role === "captain" ? "Kapitán" : "Člen") + (jeKapitan && clenove.find(c => c.character_id === p.id)?.role !== "captain" ? ' <button class="odebratClena" data-id="' + p.id + '">Odebrat</button>' : "") + "</p>").join("");
         
        
      }
    }
    console.log("Družina načtena správně");
    document.getElementById("ulozitPopis").addEventListener("click", async () => {
      const novyPopis = document.getElementById("novyPopis").value.trim();
      const { error: chybaPopisu } = await client
  .from("groups")
  .update({ description: novyPopis })
  .eq("id", groupId);
      if (chybaPopisu) {
  alert("Popis se nepodařilo uložit.");
  return;
      }
      alert("Popis byl uložen.");
      location.reload();
    
});
    document.getElementById("pridatClena").addEventListener("click", async () => {
      const jmeno = prompt("Zadej přesné jméno hráče, kterého chceš přidat:");
      if (!jmeno) return;
      const { data: hledanaPostava, error: chybaHledani } = await client
        .rpc("find_character_by_name", { search_name: jmeno });
        
      if (chybaHledani || !hledanaPostava || hledanaPostava.length === 0) {
          alert("Postava nebyla nalezena.");
          return;
      }
      const { error: chybaPridani } = await client
        .from("group_members")
        .insert({
              group_id: groupId,
              character_id: hledanaPostava[0].id,
              role: "member"
                  });
      if (chybaPridani) {
          console.log(chybaPridani);
          alert("Chyba: " + chybaPridani.message);
          return;
      }
      alert("Člen byl přidán.");
      location.reload();
      });
   document.getElementById("clenove").addEventListener("click", async (e) => {
  if (!e.target.classList.contains("odebratClena")) return;

  const characterId = e.target.dataset.id;

  const { error } = await client
    .from("group_members")
    .delete()
    .eq("group_id", groupId)
    .eq("character_id", characterId);

  if (error) {
    alert("Člena se nepodařilo odebrat.");
    return;
  }

  alert("Člen byl odebrán.");
  location.reload();
}); 
  </script>
</body>
</html>
