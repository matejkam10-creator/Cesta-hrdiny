name: Delete approved quest photos after 30 days

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Run Supabase photo cleanup
        env:
          CLEANUP_SECRET: ${{ secrets.CLEANUP_SECRET }}
        run: |
          test -n "$CLEANUP_SECRET"
          curl --fail --show-error --silent --retry 3 \
            --request POST \
            --header "x-cleanup-secret: $CLEANUP_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            https://qgnallfqanixepfvrzjn.supabase.co/functions/v1/cleanup-quest-photos
