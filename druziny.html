<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Družiny | Cesta hrdiny</title>
</head>

<body style="background:#0b0910;color:#e8c77a;text-align:center;padding:50px;font-family:serif;">

  <h1>⚔️ Cesta hrdiny</h1>
  <h2>Moje družiny</h2>

  <div id="druziny">Načítám tvoje družiny...</div>
  <h3>Vytvořit novou družinu</h3>
<input id="nazevDruziny" type="text" placeholder="Název družiny">
<button id="vytvorDruzinu">Vytvořit družinu</button>
<p id="zprava"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="module">
const SUPABASE_URL = "https://qgnallfqanixepfvrzjn.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data: { user } } = await client.auth.getUser();

if (!user) {
  window.location.href = "index.html";
}
  const { data: postava, error: postavaError } = await client
  .from("characters")
  .select("id")
  .eq("user_id", user.id)
  .single();

if (postavaError) {
  document.getElementById("druziny").textContent =
    "Postavu se nepodařilo načíst.";
}
  if (!postavaError) {
  const { data: clenstvi, error: clenstviError } = await client
    .from("group_members")
    .select("group_id, role")
    .eq("character_id", postava.id);

  if (clenstviError) {
    document.getElementById("druziny").textContent =
      "Družiny se nepodařilo načíst.";
  } else if (clenstvi.length === 0) {
    document.getElementById("druziny").textContent =
      "Zatím nejsi členem žádné družiny.";
  }
  }
  document.getElementById("vytvorDruzinu").addEventListener("click", async () => {
  const nazev = document.getElementById("nazevDruziny").value.trim();

  if (!nazev) {
    document.getElementById("zprava").textContent = "Napiš název družiny.";
    return;
  }
const { data: novaDruzina, error: chybaDruziny } = await client
  .from("groups")
  .insert({
    name: nazev,
    created_by: user.id
  })
  .select("id")
  .single();
  if (chybaDruziny) {
  document.getElementById("zprava").textContent =
    "Družinu se nepodařilo vytvořit.";
  return;
  }
  const { error: chybaClenstvi } = await client
  .from("group_members")
  .insert({
    group_id: novaDruzina.id,
    character_id: postava.id,
    role: "captain"
  });
  if (chybaClenstvi) {
  document.getElementById("zprava").textContent =
    "Družina byla vytvořena, ale nepodařilo se přidat kapitána.";
  return;
}

document.getElementById("zprava").textContent =
  "Družina byla úspěšně vytvořena!";
    });
</script>
</body>
</html>
