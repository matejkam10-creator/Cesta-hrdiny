<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Družiny | Cesta hrdiny</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0d0c11; color: #f4e4c4; font: 18px Georgia, serif; }
    main { width: min(100% - 32px, 760px); margin: 24px auto 48px; }
    h1, h2, h3 { color: #efd49b; }
    h1 { font-size: clamp(28px, 6vw, 38px); }
    a { color: #efd49b; }
    nav { display: flex; flex-wrap: wrap; gap: 8px 20px; }
    .card { padding: 20px; margin: 18px 0; border: 1px solid #6a573f; border-radius: 16px; background: #1b1720; }
    #druziny p { margin: 0; }
    #druziny .group-link { display: block; padding: 14px 0; border-bottom: 1px solid #514434; font-size: 1.08em; }
    #druziny .group-link:last-child { border-bottom: 0; }
    input { display: block; width: 100%; padding: 12px; margin: 10px 0 14px; border: 1px solid #a88a61; border-radius: 8px; background: #151219; color: #fff; font: inherit; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: #a98248; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #zprava { min-height: 24px; }

    /* Stejná hlavička a nabídka jako na mapách. */
    [hidden] { display: none !important; }
    .site-header { font-size: 16px; position: relative; z-index: 3; padding: 18px; border-bottom: 1px solid #5d4d38; background: #17131b; }
    .site-header .header-inner { max-width: 1200px; margin: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .site-header h1 { margin: 0; color: #efd49b; font-size: clamp(24px, 5vw, 36px); }
    .site-header h1 a { color: inherit; text-decoration: none; }
    .site-header h1 a:hover, .site-header h1 a:focus-visible { text-decoration: underline; }
    .site-header #menuToggle { display: grid; place-items: center; width: 48px; height: 48px; margin: 0; padding: 0; border: 1px solid #b69360; border-radius: 10px; background: #302634; color: #f1d398; font: inherit; font-size: 29px; line-height: 1; cursor: pointer; }
    .site-header #mainMenu { display: block; position: absolute; top: 100%; right: 18px; width: min(340px, calc(100vw - 36px)); margin: 0; padding: 8px; border: 1px solid #89704d; border-radius: 0 0 14px 14px; background: #211b25; box-shadow: 0 12px 28px #000a; }
    .site-header #mainMenu a { display: block; padding: 12px 14px; border-bottom: 1px solid #564535; text-decoration: none; }
    .site-header #mainMenu a:last-child { border-bottom: 0; }
    .site-header #mainMenu a:hover, .site-header #mainMenu a:focus-visible { background: #3a2c36; text-decoration: underline; }
  </style>
</head>

<body>
<header class="site-header"><div class="header-inner">
    <h1><a href="mapy.html">⚔️ Cesta hrdiny</a></h1>
    <button id="menuToggle" type="button" aria-label="Otevřít nabídku" aria-controls="mainMenu" aria-expanded="false">☰</button>
    <nav id="mainMenu" aria-label="Hlavní nabídka" hidden><a href="mapy.html">Mapy</a><a href="postava.html">Moje postava</a><a href="urovne.html">Úrovně</a><a href="historie.html">Moje úkoly</a><a href="chat.html">Společný chat</a><a href="druziny.html">Družiny</a><a id="adminLink" href="admin-ukoly.html" hidden>Kontrola úkolů</a></nav>
  </div></header>

<main>
  <h2>Moje družiny</h2>
  <section class="card" aria-label="Seznam tvých družin">
    <div id="druziny">Načítám tvoje družiny...</div>
  </section>
  <section class="card">
    <h3>Vytvořit novou družinu</h3>
    <p>Založit ji může postava od úrovně 10.</p>
    <label for="nazevDruziny">Název družiny</label>
    <input id="nazevDruziny" type="text" placeholder="Například Strážci lesa">
    <button id="vytvorDruzinu">Vytvořit družinu</button>
    <p id="zprava" role="status"></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const menuButton = document.getElementById("menuToggle");
    const menu = document.getElementById("mainMenu");
    function closeMenu() {
      menu.hidden = true;
      menuButton.setAttribute("aria-expanded", "false");
      menuButton.setAttribute("aria-label", "Otevřít nabídku");
    }
    menuButton.addEventListener("click", () => {
      const opening = menu.hidden;
      menu.hidden = !opening;
      menuButton.setAttribute("aria-expanded", String(opening));
      menuButton.setAttribute("aria-label", opening ? "Zavřít nabídku" : "Otevřít nabídku");
    });
    document.addEventListener("keydown", event => { if (event.key === "Escape") closeMenu(); });
    document.addEventListener("pointerdown", event => {
      if (!menu.hidden && !menu.contains(event.target) && !menuButton.contains(event.target)) closeMenu();
    });
    supabase.createClient("https://qgnallfqanixepfvrzjn.supabase.co", "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi")
      .rpc("is_admin").then(({ data }) => { if (data) document.getElementById("adminLink").hidden = false; });
  </script>


<script type="module">
const SUPABASE_URL = "https://qgnallfqanixepfvrzjn.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data: { user } } = await client.auth.getUser();

if (!user) {
  window.location.href = "index.html";
}
  const { data: postava, error: postavaError } = await client
  .from("characters")
  .select("id, level")
  .eq("user_id", user.id)
  .single();

if (postavaError) {
  document.getElementById("druziny").textContent =
    "Postavu se nepodařilo načíst.";
}
  if (!postavaError) {
  const { data: clenstvi, error: clenstviError } = await client
    .from("group_members")
    .select("group_id, role")
    .eq("character_id", postava.id);

  if (clenstviError) {
    document.getElementById("druziny").textContent =
      "Družiny se nepodařilo načíst.";
  } else if (clenstvi.length === 0) {
    document.getElementById("druziny").textContent =
      "Zatím nejsi členem žádné družiny.";
  }
  else {
  const ids = clenstvi.map(c => c.group_id);

  const { data: skupiny, error: skupinyError } = await client
    .from("groups")
    .select("id, name")
    .in("id", ids);

  if (skupinyError) {
    document.getElementById("druziny").textContent = "Družiny se nepodařilo načíst: " + skupinyError.message;
  } else {
    const seznamDruzin = document.getElementById("druziny");
    seznamDruzin.replaceChildren();
    for (const g of skupiny) {
      const radek = document.createElement("p");
      const odkaz = document.createElement("a");
      odkaz.className = "group-link";
      odkaz.href = "druzina.html?id=" + encodeURIComponent(g.id);
      odkaz.textContent = "⚔️ " + g.name;
      radek.append(odkaz);
      seznamDruzin.append(radek);
    }
  }
  }  
  }
  document.getElementById("vytvorDruzinu").addEventListener("click", async () => {
  const nazev = document.getElementById("nazevDruziny").value.trim();
if (!postava) {
  document.getElementById("zprava").textContent = "Nejdřív je potřeba načíst postavu.";
  return;
}
if (postava.level < 10) {
  document.getElementById("zprava").textContent =
    "Družinu můžeš založit až od úrovně 10.";
  return;
}
  if (!nazev) {
    document.getElementById("zprava").textContent = "Napiš název družiny.";
    return;
  }
const { data: novaDruzina, error: chybaDruziny } = await client
  .from("groups")
  .insert({
    name: nazev,
    created_by: user.id
  })
  .select("id")
  .single();
  if (chybaDruziny) {
  document.getElementById("zprava").textContent =
    "Družinu se nepodařilo vytvořit: " + chybaDruziny.message;
  return;
  }
  const { error: chybaClenstvi } = await client
  .from("group_members")
  .insert({
    group_id: novaDruzina.id,
    character_id: postava.id,
    role: "captain"
  });
  if (chybaClenstvi) {
  document.getElementById("zprava").textContent =
    "Družina byla vytvořena, ale nepodařilo se přidat kapitána.";
  return;
}

document.getElementById("zprava").textContent =
  "Družina byla úspěšně vytvořena!";
    window.location.href = "druzina.html?id=" + novaDruzina.id;
    });
</script>
  <script src="navigace.js" defer></script>
</body>
</html>
