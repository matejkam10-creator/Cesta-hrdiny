<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesta hrdiny</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      color: #f3ead7;
      background:
        radial-gradient(circle at top, #342b3d 0%, #17141c 45%, #09080b 100%);
    }

    .page {
      width: min(100%, 500px);
      min-height: 100vh;
      margin: auto;
      padding: 55px 24px 35px;
      text-align: center;
    }

    .symbol { font-size: 48px; margin-bottom: 14px; }

    h1 {
      margin: 0;
      font-size: 38px;
      color: #e8c47c;
    }

    .subtitle {
      margin: 12px 0 42px;
      color: #b9ad9d;
      line-height: 1.6;
    }

    .card {
      padding: 26px 20px;
      border: 1px solid #66533d;
      border-radius: 18px;
      background: rgba(20,17,22,.88);
    }

    .card h2 { margin-top: 0; color: #f1dfba; }

    input {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border: 1px solid #554a40;
      border-radius: 10px;
      background: #0e0d10;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #a67c3d;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .register {
      margin-top: 22px;
      color: #aaa096;
      font-size: 14px;
    }

    .register span { color: #e8c47c; }
    .register button { width: auto; margin: 0; padding: 0; border: 0; background: none; color: #e8c47c; font: inherit; text-decoration: underline; cursor: pointer; }
    [hidden] { display: none !important; }
    label { display: block; margin-top: 12px; text-align: left; }
    .helper { color: #b9ad9d; font-size: 14px; line-height: 1.5; }
    button:disabled { opacity: .6; cursor: wait; }

    #status {
      min-height: 22px;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="symbol">⚔️</div>
    <h1>Cesta hrdiny</h1>

    <p class="subtitle">
      Vstup do světa dobrodružství.<br>
      Tvůj příběh právě začíná.
    </p>

    <section class="card">
      <h2>Přihlášení</h2>

      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required placeholder="E-mail">
      <label for="password">Heslo</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="Heslo">

      <button id="login">Přihlásit se</button>
      <button id="reset" type="button">Zapomenuté heslo</button>
      <button id="resendConfirmation" type="button">Poslat potvrzovací e-mail znovu</button>

      <div id="status" role="status" aria-live="polite"></div>

      <p class="register">
        Ještě nemáš účet? <button id="showRegister" type="button">Vytvořit účet</button>
      </p>
    </section>
    <section id="registration" class="card" hidden>
      <h2>Vytvořit účet</h2>
      <p class="helper">Stačí e-mail a heslo. Jméno, adresu ani telefon pro registraci nepotřebujeme. Tvé herní jméno si vybereš po přihlášení.</p>
      <form id="registerForm">
        <label for="registerEmail">E-mail</label>
        <input id="registerEmail" type="email" autocomplete="email" required maxlength="254">
        <label for="registerPassword">Heslo (nejméně 12 znaků)</label>
        <input id="registerPassword" type="password" autocomplete="new-password" minlength="12" required>
        <label for="registerConfirm">Potvrď heslo</label>
        <input id="registerConfirm" type="password" autocomplete="new-password" minlength="12" required>
        <button type="submit">Vytvořit účet</button>
      </form>
      <p id="registrationStatus" role="status" aria-live="polite"></p>
      <p class="register"><button id="showLogin" type="button">Zpět na přihlášení</button></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://qgnallfqanixepfvrzjn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const loginCard = document.querySelector(".card");
    const registration = document.getElementById("registration");
    document.getElementById("showRegister").addEventListener("click", () => {
      loginCard.hidden = true;
      registration.hidden = false;
      document.getElementById("registerEmail").focus();
    });
    document.getElementById("showLogin").addEventListener("click", () => {
      registration.hidden = true;
      loginCard.hidden = false;
      document.getElementById("email").focus();
    });
    document.getElementById("registerForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const status = document.getElementById("registrationStatus");
      const email = document.getElementById("registerEmail").value.trim();
      const password = document.getElementById("registerPassword").value;
      const confirm = document.getElementById("registerConfirm").value;
      if (password !== confirm) { status.textContent = "Hesla se neshodují."; return; }
      if (password.length < 12) { status.textContent = "Heslo musí mít alespoň 12 znaků."; return; }
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      status.textContent = "Vytvářím účet...";
      const emailRedirectTo = new URL("index.html", window.location.href).href;
      const { data, error } = await client.auth.signUp({ email, password, options: { emailRedirectTo } });
      button.disabled = false;
      if (error) {
        status.textContent = error.message.includes("password")
          ? "Heslo nevyhovuje bezpečnostním pravidlům. Vyber delší a méně obvyklé heslo."
          : "Účet se teď nepodařilo vytvořit. Zkus to prosím později.";
        return;
      }
      form.reset();
      if (data.session) {
        await client.auth.signOut();
        status.textContent = "Potvrzení e-mailu zatím není zapnuté. Registraci dokončíme až po nastavení ochrany účtů.";
        return;
      }
      document.getElementById("email").value = email;
      status.textContent = "Pokud může být účet vytvořen, přijde ti potvrzovací odkaz e-mailem. Když nedorazí, vrať se k přihlášení a použij tlačítko Poslat potvrzovací e-mail znovu.";
    });

    document.getElementById("resendConfirmation").addEventListener("click", async () => {
      const field = document.getElementById("email");
      const email = field.value.trim();
      const status = document.getElementById("status");
      if (!email || !field.checkValidity()) {
        status.textContent = "Nejdřív zadej e-mail použitý při registraci.";
        field.focus();
        return;
      }
      const button = document.getElementById("resendConfirmation");
      button.disabled = true;
      status.textContent = "Odesílám nový potvrzovací odkaz...";
      const emailRedirectTo = new URL("index.html", window.location.href).href;
      const { error } = await client.auth.resend({
        type: "signup", email, options: { emailRedirectTo }
      });
      status.textContent = error
        ? "Odkaz se nepodařilo odeslat: " + error.message
        : "Pokud účet čeká na potvrzení, dorazí nový odkaz. Zkontroluj také Spam a Hromadné zprávy.";
      if (error) button.disabled = false;
      else setTimeout(() => { button.disabled = false; }, 60000);
    });

    document.getElementById("reset").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const status = document.getElementById("status");
      if (!email || !document.getElementById("email").checkValidity()) {
        status.textContent = "Zadej nejprve platný e-mail.";
        return;
      }
      const button = document.getElementById("reset");
      button.disabled = true;
      const redirectTo = new URL("reset-hesla.html", window.location.href).href;
      const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });
      status.textContent = error
        ? "Požadavek se teď nepodařilo dokončit. Zkus to později."
        : "Pokud účet existuje, přijde na zadaný e-mail odkaz pro obnovu hesla.";
      button.disabled = false;
    });

    document.getElementById("login").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const status = document.getElementById("status");

      status.textContent = "Přihlašuji...";

      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        status.textContent = "Přihlášení se nezdařilo. Zkontroluj e-mail, heslo a potvrzení účtu.";
        
        return;
      }

      status.textContent = "Přihlášení proběhlo úspěšně.";
      window.location.href = "postava.html";
    });
  </script>
</body>
</html>
