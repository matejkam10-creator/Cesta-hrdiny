<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapy | Cesta hrdiny</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; background: #0d0c11; color: #f4e4c4; font-family: Georgia, serif; }
    button { font: inherit; cursor: pointer; }
    a { color: #f1d398; }
    header { padding: 22px 18px; border-bottom: 1px solid #5d4d38; background: #17131b; }
    .header-inner { max-width: 1200px; margin: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; color: #efd49b; font-size: clamp(24px, 5vw, 36px); }
    .header-inner nav { display: flex; gap: 14px; flex-wrap: wrap; }
    main { max-width: 1200px; margin: 26px auto; padding: 0 16px; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 22px; align-items: start; }
    .panel { border: 1px solid #68563f; border-radius: 18px; background: #1b1720; padding: 20px; }
    h2 { margin: 0 0 10px; color: #efd49b; }
    #mapTabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
    #mapTabs button { padding: 9px 14px; border: 1px solid #716049; border-radius: 9px; background: #25202a; color: #f4e4c4; }
    #mapTabs button[aria-selected="true"] { background: #866333; border-color: #e3be7c; }
    #mapTabs button:disabled { opacity: .55; cursor: not-allowed; }
    #mapDescription { min-height: 24px; color: #cdbd9e; }
    .map { position: relative; overflow: hidden; height: clamp(420px, 64vw, 640px); border: 2px solid #89704d; border-radius: 16px; background-color: #36483b; background-image: radial-gradient(ellipse at 17% 21%, #718764 0 9%, transparent 10%), radial-gradient(ellipse at 80% 75%, #566e50 0 13%, transparent 14%), radial-gradient(ellipse at 62% 18%, #85906a 0 8%, transparent 9%), repeating-linear-gradient(128deg, transparent 0 31px, #ffffff0a 32px 34px, transparent 35px 72px), linear-gradient(145deg, #454d38, #263b3c); }
    .map.city { background-color: #574c45; background-image: linear-gradient(25deg, transparent 47%, #bba57988 48% 51%, transparent 52%), linear-gradient(125deg, transparent 45%, #bba57977 46% 49%, transparent 50%), repeating-linear-gradient(90deg, #3f3433 0 36px, #66584c 37px 75px, #4d403b 76px 103px); }
    .map.group { background-color: #433b55; background-image: radial-gradient(circle at 60% 40%, #77689d 0%, #41334e 38%, #202536 100%); }
    .map::after { content: ''; position: absolute; inset: 12px; border: 2px solid #f1d39877; border-radius: 12px; pointer-events: none; }
    .map-label { position: absolute; top: 28px; left: 28px; z-index: 1; font-size: clamp(26px, 5vw, 46px); color: #fff1c9; text-shadow: 0 2px 7px #101010; }
    .marker { position: absolute; z-index: 2; transform: translate(-50%, -50%); display: grid; place-items: center; width: 54px; height: 54px; border: 3px solid #fff1ca; border-radius: 50%; background: #9e6a30; color: #fff; box-shadow: 0 4px 16px #0009; font-size: 25px; }
    .marker:focus-visible, .marker:hover { outline: 3px solid #fff; outline-offset: 3px; }
    .empty { position: absolute; bottom: 22px; left: 24px; right: 24px; z-index: 1; padding: 12px; border-radius: 9px; background: #16141ad9; color: #fff1ca; text-align: center; }
    aside { position: sticky; top: 18px; text-align: center; }
    .avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 2px solid #e4c48a; }
    .note { color: #c9bda8; font-size: 14px; }
    dialog { width: min(92vw, 560px); padding: 24px; border: 1px solid #bd9a62; border-radius: 16px; background: #211b25; color: #f4e4c4; }
    dialog::backdrop { background: #000a; }
    #questText { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
    .close { padding: 10px 18px; border: 0; border-radius: 8px; background: #aa8349; color: #fff; }
    #questForm textarea, #groupQuestForm textarea, #groupSelect, #photoFile { display: block; width: 100%; padding: 12px; margin: 12px 0; border: 1px solid #a88a61; border-radius: 8px; background: #17131b; color: #fff; font: inherit; }
    #questForm textarea, #groupQuestForm textarea { min-height: 130px; resize: vertical; }
    #questForm button, #groupQuestForm button, #photoUpload { padding: 10px 16px; border: 0; border-radius: 8px; background: #aa8349; color: #fff; }
    #questForm button:disabled, #photoUpload:disabled { opacity: .6; }
    @media (max-width: 760px) { main { display: flex; flex-direction: column; } main > * { width: 100%; } aside { position: static; order: -1; } .map { height: min(72vh, 580px); min-height: 390px; } }
  </style>
</head>
<body>
  <header><div class="header-inner">
    <h1>⚔️ Cesta hrdiny</h1>
    <nav><a href="postava.html">Moje postava</a><a href="historie.html">Moje úkoly</a><a href="druziny.html">Družiny</a><a id="adminLink" href="admin-ukoly.html" hidden>Kontrola úkolů</a></nav>
  </div></header>
  <main>
    <section class="panel" aria-labelledby="mapTitle">
      <h2 id="mapTitle">Mapy světa</h2>
      <p id="mapDescription" role="status">Načítám mapy...</p>
      <div id="mapTabs" role="tablist" aria-label="Oblasti"></div>
      <div id="mapView" class="map" aria-label="Mapa s úkoly"></div>
      <p class="note">Klepni na bod mapy a zobrazí se zadání úkolu.</p>
    </section>
    <aside class="panel" aria-label="Tvoje postava">
      <div id="profile">Načítám postavu...</div>
      <p><a href="postava.html">Otevřít profil</a></p>
    </aside>
  </main>
  <dialog id="questDialog" aria-labelledby="questTitle">
    <h2 id="questTitle"></h2>
    <p id="questText"></p>
    <p id="questInfo"></p>
    <p id="questStatus" role="status"></p>
    <form id="questForm" hidden>
      <label for="questAnswer">Jak úkol vyřeší tvoje postava? (10–5000 znaků)</label>
      <textarea id="questAnswer" minlength="10" maxlength="5000" required></textarea>
      <button type="submit">Odevzdat řešení</button>
    </form>
    <div id="groupSection" hidden>
      <label for="groupSelect">Tvoje družina</label>
      <select id="groupSelect"></select>
      <p id="groupStatus" role="status"></p>
      <form id="groupQuestForm" hidden>
        <label for="groupAnswer">Společné řešení družiny (10–5000 znaků)</label>
        <textarea id="groupAnswer" minlength="10" maxlength="5000" required></textarea>
        <button type="submit">Odevzdat za družinu</button>
      </form>
    </div>
    <div id="photoSection" hidden>
      <label for="photoFile">Fotky k řešení (nepovinné; nejvýše 5, každá JPG, PNG nebo WebP do 5 MB)</label>
      <input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp" multiple>
      <button id="photoUpload" type="button" hidden>Přidat vybrané fotky</button>
      <p id="photoStatus" role="status"></p>
      <div id="photoLinks"></div>
    </div>
    <form method="dialog"><button class="close">Zavřít</button></form>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    const client = supabase.createClient("https://qgnallfqanixepfvrzjn.supabase.co", "sb_publishable_Y7QqWlRF_op6jq2CLVYKPQ_af2NsMJi");
    const { data: { user }, error: authError } = await client.auth.getUser();
    if (authError || !user) {
      location.replace("index.html");
    } else {
      client.rpc("is_admin").then(({ data }) => {
        if (data) document.getElementById("adminLink").hidden = false;
      });
      const profile = document.getElementById("profile");
      const mapDescription = document.getElementById("mapDescription");
      const { data: character, error: characterError } = await client.from("characters")
        .select("id, name, nickname, avatar_url, level, total_xp").eq("user_id", user.id).single();
      if (characterError || !character) {
        profile.textContent = "Postavu se nepodařilo načíst.";
        mapDescription.textContent = "Nejdřív je potřeba vytvořit postavu.";
      } else {
        profile.replaceChildren();
        if (character.avatar_url) {
          const img = document.createElement("img");
          img.className = "avatar";
          img.alt = "Avatar postavy";
          img.src = character.avatar_url;
          profile.append(img);
        }
        const name = document.createElement("h2");
        name.textContent = character.nickname || character.name;
        const stats = document.createElement("p");
        stats.textContent = `Úroveň ${character.level} · ${character.total_xp} XP`;
        profile.append(name, stats);
        const { data: memberships, error: membershipError } = await client.from("group_members")
          .select("group_id, role").eq("character_id", character.id);
        const member = !membershipError && (memberships?.length ?? 0) > 0;
        const { data: maps, error: mapsError } = await client.from("maps")
          .select("id, name, description, required_level, order_index")
          .eq("is_active", true).order("order_index");
        if (mapsError) {
          mapDescription.textContent = "Mapy se nepodařilo načíst: " + mapsError.message;
        } else if (!maps?.length) {
          mapDescription.textContent = "Mapy zatím nejsou připravené.";
        } else {
          const tabs = document.getElementById("mapTabs");
          const view = document.getElementById("mapView");
          const locked = m => character.level < m.required_level || (m.required_level >= 10 && !member);
          let chosenQuest = null;
          let currentSubmissionId = null;
          let currentPhotoTarget = null;
          let photoCount = 0;
          const questForm = document.getElementById("questForm");
          const groupSection = document.getElementById("groupSection");
          const groupSelect = document.getElementById("groupSelect");
          const groupQuestForm = document.getElementById("groupQuestForm");
          const groupStatus = document.getElementById("groupStatus");
          if (member) {
            const { data: groups } = await client.from("groups").select("id, name")
              .in("id", memberships.map(m => m.group_id));
            for (const membership of memberships) {
              const option = document.createElement("option");
              option.value = membership.group_id;
              option.textContent = groups?.find(g => g.id === membership.group_id)?.name || "Družina";
              groupSelect.append(option);
            }
          }
          async function loadGroupQuestStatus() {
            if (!chosenQuest?.is_group_quest || !groupSelect.value) return;
            const questId = chosenQuest.id;
            const groupId = groupSelect.value;
            groupQuestForm.hidden = true;
            resetPhotos();
            groupStatus.textContent = "Načítám stav družinového úkolu...";
            const { data: submissions, error } = await client.from("group_submissions")
              .select("id, status, review_comment").eq("group_id", groupId)
              .eq("quest_id", questId).order("created_at", { ascending: false }).limit(1);
            if (chosenQuest?.id !== questId || groupSelect.value !== groupId) return;
            if (error) { groupStatus.textContent = "Stav úkolu se nepodařilo načíst: " + error.message; return; }
            const submission = submissions?.[0];
            if (submission?.status === "pending") groupStatus.textContent = "Řešení družiny čeká na schválení.";
            else if (submission?.status === "approved") groupStatus.textContent = "Úkol už má družina schválený. XP získali členové při odevzdání.";
            else if (memberships.find(m => m.group_id === groupId)?.role !== "captain")
              groupStatus.textContent = "Za družinu odevzdává řešení kapitán.";
            else if (character.level < chosenQuest.required_level)
              groupStatus.textContent = `Kapitán potřebuje úroveň ${chosenQuest.required_level}.`;
            else {
              groupStatus.textContent = submission?.status === "returned"
                ? "Řešení bylo vráceno: " + (submission.review_comment || "Bez komentáře") : "XP po schválení získají všichni současní členové družiny.";
              groupQuestForm.hidden = false;
              photoSection.hidden = false;
              photoFile.hidden = false;
              photoStatus.textContent = "Fotky můžeš vybrat teď nebo přidat po odevzdání řešení.";
            }
            if (submission) await loadPhotoFiles("group", submission.id,
              submission.status === "pending" && memberships.find(m => m.group_id === groupId)?.role === "captain");
          }
          groupSelect.addEventListener("change", loadGroupQuestStatus);
          groupQuestForm.addEventListener("submit", async event => {
            event.preventDefault();
            if (!chosenQuest?.is_group_quest || !groupSelect.value) return;
            const button = groupQuestForm.querySelector("button");
            button.disabled = true;
            groupStatus.textContent = "Odesílám řešení družiny...";
            const { data: submissionId, error } = await client.rpc("submit_group_quest", {
              p_group_id: groupSelect.value,
              p_quest_id: chosenQuest.id,
              p_answer: document.getElementById("groupAnswer").value.trim()
            });
            button.disabled = false;
            if (error) groupStatus.textContent = "Řešení se nepodařilo odeslat: " + error.message;
            else {
              groupQuestForm.hidden = true;
              groupStatus.textContent = "Řešení družiny čeká na schválení.";
              await loadPhotoFiles("group", submissionId, true);
              if (photoFile.files.length) await uploadPhotos();
            }
          });
          const questStatus = document.getElementById("questStatus");
          const photoSection = document.getElementById("photoSection");
          const photoFile = document.getElementById("photoFile");
          const photoUpload = document.getElementById("photoUpload");
          const photoStatus = document.getElementById("photoStatus");
          const photoLinks = document.getElementById("photoLinks");
          function resetPhotos() {
            currentPhotoTarget = null;
            photoCount = 0;
            photoSection.hidden = true;
            photoFile.value = "";
            photoFile.hidden = false;
            photoUpload.hidden = true;
            photoLinks.replaceChildren();
            photoStatus.textContent = "";
          }
          async function loadPhotoFiles(kind, id, canUpload) {
            currentPhotoTarget = { kind, id };
            const table = kind === "group" ? "group_submission_files" : "submission_files";
            const column = kind === "group" ? "group_submission_id" : "submission_id";
            const { data: files, error } = await client.from(table)
              .select("file_url").eq(column, id).order("uploaded_at");
            if (currentPhotoTarget?.id !== id || currentPhotoTarget?.kind !== kind) return;
            photoSection.hidden = false;
            photoLinks.replaceChildren();
            if (error) { photoStatus.textContent = "Přílohy se nepodařilo načíst: " + error.message; return; }
            photoCount = files.length;
            files.forEach((file, index) => {
              const link = document.createElement("a");
              link.href = "#";
              link.textContent = `Zobrazit fotku ${index + 1}`;
              link.style.display = "block";
              link.addEventListener("click", async event => {
                event.preventDefault();
                const { data, error: linkError } = await client.storage.from("quest-evidence")
                  .createSignedUrl(file.file_url, 300);
                if (linkError) photoStatus.textContent = "Fotku nelze otevřít: " + linkError.message;
                else window.open(data.signedUrl, "_blank", "noopener,noreferrer");
              });
              photoLinks.append(link);
            });
            photoFile.hidden = !canUpload || photoCount >= 5;
            photoUpload.hidden = !canUpload || photoCount >= 5;
            if (photoCount >= 5) photoStatus.textContent = "Byl dosažen limit 5 fotek.";
          }
          async function uploadPhotos() {
            const files = Array.from(photoFile.files);
            const target = currentPhotoTarget;
            if (!files.length) { photoStatus.textContent = "Nejdřív vyber fotky."; return; }
            if (!target) return;
            if (files.length > 5 - photoCount) {
              photoStatus.textContent = `Můžeš přidat ještě ${5 - photoCount} fotek.`;
              return;
            }
            if (files.some(file => !["image/jpeg", "image/png", "image/webp"].includes(file.type)
              || file.size > 5 * 1024 * 1024)) {
              photoStatus.textContent = "Každý obrázek musí být JPG, PNG nebo WebP do 5 MB.";
              return;
            }
            photoUpload.disabled = true;
            let uploaded = 0;
            try {
              for (const file of files) {
                photoStatus.textContent = `Nahrávám fotku ${uploaded + 1} z ${files.length}...`;
                const original = await createImageBitmap(file);
                const ratio = Math.min(1, 1600 / Math.max(original.width, original.height));
                const canvas = document.createElement("canvas");
                canvas.width = Math.max(1, Math.round(original.width * ratio));
                canvas.height = Math.max(1, Math.round(original.height * ratio));
                const ctx = canvas.getContext("2d");
                if (!ctx) throw new Error("Fotku se nepodařilo zpracovat.");
                ctx.fillStyle = "#fff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(original, 0, 0, canvas.width, canvas.height);
                original.close();
                const blob = await new Promise((resolve, reject) => canvas.toBlob(
                  b => b ? resolve(b) : reject(new Error("Fotku se nepodařilo zpracovat.")), "image/jpeg", 0.85
                ));
                if (blob.size > 5 * 1024 * 1024) throw new Error("Fotka je příliš velká.");
                const path = user.id + "/" + crypto.randomUUID() + ".jpg";
                const { error: uploadError } = await client.storage.from("quest-evidence")
                  .upload(path, blob, { contentType: "image/jpeg", upsert: false });
                if (uploadError) throw uploadError;
                const args = target.kind === "group"
                  ? { p_group_submission_id: target.id, p_file_path: path }
                  : { p_submission_id: target.id, p_file_path: path };
                const { error: attachError } = await client.rpc(
                  target.kind === "group" ? "attach_group_photo" : "attach_personal_photo", args);
                if (attachError) throw attachError;
                uploaded++;
              }
              if (currentPhotoTarget?.id === target.id) {
                photoFile.value = "";
                await loadPhotoFiles(target.kind, target.id, true);
                photoStatus.textContent = `${uploaded} fotek přiloženo k řešení.`;
              }
            } catch (error) {
              if (currentPhotoTarget?.id === target.id) {
                await loadPhotoFiles(target.kind, target.id, true);
                photoStatus.textContent = `${uploaded} z ${files.length} fotek přiloženo. Chyba: ${error.message}`;
              }
            } finally {
              photoUpload.disabled = false;
            }
          }
          photoUpload.addEventListener("click", uploadPhotos);
          questForm.addEventListener("submit", async event => {
            event.preventDefault();
            if (!chosenQuest) return;
            const button = questForm.querySelector("button");
            button.disabled = true;
            questStatus.textContent = "Odesílám řešení...";
            const { data: submissionId, error } = await client.rpc("submit_personal_quest", {
              p_quest_id: chosenQuest.id,
              p_text: document.getElementById("questAnswer").value.trim()
            });
            button.disabled = false;
            if (error) {
              questStatus.textContent = "Řešení se nepodařilo odeslat: " + error.message;
            } else {
              currentSubmissionId = submissionId;
              questForm.hidden = true;
              questStatus.textContent = "Řešení bylo odesláno a čeká na schválení. XP se připíše až po schválení.";
              await loadPhotoFiles("personal", submissionId, true);
              if (photoFile.files.length) await uploadPhotos();
            }
          });
          async function showMap(map, chosenTab) {
            tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", String(b === chosenTab)));
            document.getElementById("mapTitle").textContent = map.name;
            mapDescription.textContent = map.description || "Vydej se za dobrodružstvím.";
            view.className = "map " + (map.required_level >= 10 ? "group" : map.order_index === 1 ? "city" : "nature");
            view.replaceChildren();
            const label = document.createElement("strong");
            label.className = "map-label";
            label.textContent = map.name;
            view.append(label);
            const { data: quests, error: questsError } = await client.from("quests")
              .select("id, name, description, difficulty, xp_reward, required_level, is_group_quest")
              .eq("map_id", map.id).eq("is_active", true).order("created_at");
            if (questsError || !quests?.length) {
              const empty = document.createElement("p");
              empty.className = "empty";
              empty.textContent = questsError ? "Úkoly se nepodařilo načíst." : "Úkoly na této mapě teprve připravujeme.";
              view.append(empty);
              return;
            }
            const locations = [[23,28],[70,23],[48,47],[80,68],[25,74],[57,80],[40,18],[62,61]];
            quests.forEach((quest, index) => {
              const [x,y] = locations[index % locations.length];
              const marker = document.createElement("button");
              marker.className = "marker";
              marker.style.left = x + "%";
              marker.style.top = y + "%";
              marker.textContent = "!";
              marker.title = quest.name;
              marker.setAttribute("aria-label", "Úkol: " + quest.name);
              marker.addEventListener("click", async () => {
                chosenQuest = quest;
                currentSubmissionId = null;
                resetPhotos();
                document.getElementById("questTitle").textContent = quest.name;
                document.getElementById("questText").textContent = quest.description;
                const difficult = { easy: "Lehká", medium: "Střední", hard: "Těžká" };
                document.getElementById("questInfo").textContent =
                  `Obtížnost: ${difficult[quest.difficulty] || quest.difficulty} · Odměna: ${quest.xp_reward} XP · Od úrovně ${quest.required_level}` +
                  (quest.is_group_quest ? " · Družinový úkol" : "");
                questForm.hidden = true;
                questForm.reset();
                groupSection.hidden = true;
                groupQuestForm.reset();
                questStatus.textContent = "Načítám stav úkolu...";
                document.getElementById("questDialog").showModal();
                if (quest.is_group_quest) {
                  questStatus.textContent = "Družinový úkol";
                  if (!member || !groupSelect.options.length) {
                    questStatus.textContent = "Nejdřív se přidej do družiny.";
                    return;
                  }
                  groupSection.hidden = false;
                  await loadGroupQuestStatus();
                  return;
                }
                if (character.level < quest.required_level) {
                  questStatus.textContent = `Tento úkol je dostupný od úrovně ${quest.required_level}.`;
                  return;
                }
                const { data: assignments, error: assignmentError } = await client
                  .from("quest_assignments").select("id, status")
                  .eq("quest_id", quest.id).eq("character_id", character.id)
                  .order("taken_at", { ascending: false }).limit(1);
                if (chosenQuest !== quest || !document.getElementById("questDialog").open) return;
                if (assignmentError) {
                  questStatus.textContent = "Stav úkolu se nepodařilo načíst.";
                  return;
                }
                const status = assignments?.[0]?.status;
                if (status === "submitted" || status === "approved") {
                  questStatus.textContent = status === "submitted"
                    ? "Tvoje řešení čeká na schválení." : "Úkol už máš schválený.";
                  const { data: submissions, error: submissionError } = await client
                    .from("submissions").select("id")
                    .eq("assignment_id", assignments[0].id)
                    .order("created_at", { ascending: false }).limit(1);
                  if (chosenQuest !== quest || !document.getElementById("questDialog").open) return;
                  if (submissionError || !submissions?.length) {
                    photoStatus.textContent = "Přílohy se nepodařilo načíst.";
                    return;
                  }
                  currentSubmissionId = submissions[0].id;
                  await loadPhotoFiles("personal", currentSubmissionId, status === "submitted");
                }
                else {
                  questStatus.textContent = status === "rejected" ? "Předchozí řešení bylo vráceno. Další pokus závisí na limitu úkolu." : "";
                  questForm.hidden = false;
                  photoSection.hidden = false;
                  photoStatus.textContent = "Fotky můžeš vybrat teď nebo přidat po odevzdání řešení.";
                }
              });
              view.append(marker);
            });
          }
          for (const map of maps) {
            const tab = document.createElement("button");
            tab.type = "button";
            tab.setAttribute("role", "tab");
            tab.setAttribute("aria-selected", "false");
            tab.textContent = map.name + (locked(map) ? " 🔒" : "");
            tab.disabled = locked(map);
            if (locked(map)) tab.title = map.required_level >= 10 ? "Od úrovně 10 a pro členy družiny" : `Od úrovně ${map.required_level}`;
            else tab.addEventListener("click", () => showMap(map, tab));
            tabs.append(tab);
          }
          const first = maps.find(m => !locked(m));
          if (first) await showMap(first, Array.from(tabs.children)[maps.indexOf(first)]);
          else mapDescription.textContent = "Zatím nemáš přístup k žádné mapě.";
        }
      }
    }
  </script>
</body>
</html>
